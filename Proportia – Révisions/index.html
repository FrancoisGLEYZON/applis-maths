<style>
/* VOICE: jeu de révision joyeux, lisible pour des élèves en difficulté (PAP) : grands caractères, consignes courtes.
   IDEA: une console portable des années 2000 — carte du monde en pixel art, combats en boîtes de dialogue doubles.
   PICTURE: la carte de la région Proportia (plaine, port, labo, cascade, mont, Ligue) avec le dresseur qui s'y déplace.
   COLOUR and TYPE: vert prairie dominant, bleu-ardoise des cadres, rouge vif d'interface ; Press Start 2P pour les titres, Atkinson Hyperlegible pour lire.
   LAYOUT: écran de jeu centré max 1100px ; carte + panneau ; combat = terrain en haut, dialogue en bas ; tout s'empile sous 600px. */
:root{color-scheme:light dark;
--bg:light-dark(#cfe9b4,#0f1f17);--ink:light-dark(#18241b,#eef5e8);--panel:light-dark(#ffffff,#1b2b24);
--soft:light-dark(#f1f7ea,#22362d);--line:light-dark(#2f3d5c,#a9bde0);--red:#e2403a;--gold:#f2b705;
--ok:light-dark(#2e8b3a,#6fd67c);--warn:light-dark(#b85c00,#ffb357);--bad:light-dark(#c62828,#ff7a7a);
--grass:light-dark(#7ccf5a,#2f6b3a);--grass2:light-dark(#69b84a,#285c32);--path:light-dark(#ecd9a0,#8a7a50);--water:light-dark(#5ab8f0,#1f5d86)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 'Atkinson Hyperlegible',system-ui,sans-serif;overflow-x:clip}
.px{font-family:'Press Start 2P',monospace;line-height:1.5}
#app{max-width:1100px;margin:0 auto;padding:14px max(3vw,12px) 40px}
h1,h2,h3{font-family:'Press Start 2P',monospace;font-weight:400;line-height:1.35;margin:0 0 12px;text-wrap:balance}
h1{font-size:clamp(22px,4vw,36px)}h2{font-size:clamp(15px,2.4vw,20px)}h3{font-size:13px}
.box{background:var(--panel);border:4px solid var(--line);border-radius:6px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 5px light-dark(#c9d4e8,#3c5068);padding:18px}
.btn{font-family:'Press Start 2P',monospace;font-size:12px;line-height:1.4;min-height:44px;padding:12px 16px;border:3px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);box-shadow:0 4px 0 var(--line);cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn:focus-visible,.cell:focus-visible,input:focus-visible,.choice:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.main{background:var(--red);color:#fff}.btn.gold{background:var(--gold);color:#2a2000}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.hud{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:14px}
.chip{font-family:'Press Start 2P',monospace;font-size:11px;background:var(--panel);border:3px solid var(--line);border-radius:4px;padding:8px 10px;display:inline-flex;gap:8px;align-items:center}
.prof-banner{background:var(--gold);color:#2a2000;font-family:'Press Start 2P',monospace;font-size:11px;padding:8px 12px;border-radius:4px;margin-bottom:10px}

.logo{font-size:clamp(28px,6vw,54px);color:var(--red);text-shadow:4px 4px 0 var(--line);margin:4px 0 10px}
.parade{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;background:var(--grass);border:4px solid var(--line);border-radius:6px;padding:20px 10px;margin-top:14px}
.plist{display:grid;gap:10px;margin:12px 0}
.pbtn{display:flex;gap:12px;align-items:center;text-align:left;width:100%}

.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0 18px}

.pick button[aria-pressed=true]{background:var(--gold);color:#2a2000}
input[type=text],input[type=password]{font:18px 'Atkinson Hyperlegible',sans-serif;padding:10px 12px;border:3px solid var(--line);border-radius:4px;background:var(--soft);color:var(--ink);min-height:48px;width:100%;max-width:340px}

.intro{position:fixed;inset:0;z-index:30;display:none;overflow:hidden}.intro.on{display:block}.intro.out{opacity:0;transition:opacity .35s}
.fl{position:absolute;inset:0;background:#fff;opacity:0;animation:fl2 .8s linear}@keyframes fl2{20%{opacity:.85}40%{opacity:0}60%{opacity:.85}80%{opacity:0}}
.bars{position:absolute;inset:0;display:grid;grid-template-rows:repeat(10,1fr)}.bars i{background:#111;transform:translateX(-101%);animation:bar .4s steps(6) forwards}.bars i:nth-child(even){transform:translateX(101%)}@keyframes bar{to{transform:none}}
.vs{position:absolute;inset:0;background:#111;opacity:0;animation:vsin .3s 1.4s forwards;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:1fr auto;align-items:center;justify-items:center;padding:4vh 4vw;gap:12px}
@keyframes vsin{to{opacity:1}}
.vsband{position:absolute;inset:0;background:var(--c);clip-path:polygon(0 22%,100% 8%,100% 66%,0 80%)}
.vsP,.vsC{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;color:#fff;font-family:'Press Start 2P',monospace;font-size:12px;text-align:center;text-shadow:2px 2px 0 #000}
.vs svg.sp,.vs img.cimg,.vs img.trimg{width:auto!important;height:clamp(140px,38vh,320px)!important;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.4))}.vsC .crew img.cimg{height:clamp(60px,13vh,110px)!important}
.vsP{animation:slL .5s 1.6s both steps(8)}.vsC{animation:slR .5s 1.6s both steps(8)}@keyframes slL{from{transform:translateX(-70vw)}}@keyframes slR{from{transform:translateX(70vw)}}
.vsT{position:relative;font-size:clamp(40px,9vw,96px);color:#f2b705;text-shadow:5px 5px 0 #000;animation:zoom .4s 2s both steps(5)}@keyframes zoom{from{transform:scale(3);opacity:0}}
.vsQ{grid-column:1/-1;position:relative;max-width:640px;width:100%;opacity:0;animation:vsin .3s 2.3s forwards}

@media(max-width:600px){.vs{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto;align-content:center}.vsQ{grid-column:auto}}

.badges{display:flex;flex-wrap:wrap;gap:6px}
/* ville */
.banner{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;color:#fff;border:4px solid var(--line);border-radius:6px;padding:18px;margin-bottom:16px;text-shadow:2px 2px 0 rgba(0,0,0,.35)}

/* combat */
.field{position:relative;height:clamp(210px,32vw,280px);border:4px solid var(--line);border-radius:6px 6px 0 0;overflow:hidden;background:#9fd8ff}
.field canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.foe{position:absolute;right:10%;top:2%;height:46%;animation:idle 1.4s steps(2) infinite}.foe svg,.bud svg,.foe img,.bud img{height:100%!important;width:auto!important}.bud img{transform:scaleX(-1)}.crimg.sil{filter:brightness(0) opacity(.55)}.crimg,.trimg{filter:drop-shadow(2px 3px 0 rgba(0,0,0,.18))}.foe.ch{height:64%;top:0;right:8%}.banner img.cimg{background:rgba(255,255,255,.18);border-radius:6px}.bud{position:absolute;left:8%;bottom:3%;height:50%;animation:idle 1.7s steps(2) infinite}.bud svg{transform:scaleX(-1)}@keyframes idle{50%{transform:translateY(-3px)}}.foe.shake{animation:sh .35s steps(4)}
.stat{position:absolute;background:var(--panel);border:3px solid var(--line);border-radius:4px;padding:8px 10px;font-family:'Press Start 2P',monospace;font-size:10px;min-width:170px}

.fb b{font-family:'Press Start 2P',monospace;font-size:11px;display:block;margin-bottom:6px}

.tb{border-collapse:collapse;margin:8px 0;font-size:16px}.tb th,.tb td{border:2px solid var(--line);padding:6px 10px;text-align:right;white-space:nowrap}.tb th{background:var(--soft);text-align:left}

@media (prefers-reduced-motion:reduce){.shake,.flash,.foe,.bud{animation:none}.token.walk svg{animation:none}}
/* modale */
#modal{position:fixed;inset:0;background:rgba(10,20,15,.6);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
#modal.open{display:flex}
#modal .box{max-width:680px;width:100%;max-height:90vh;overflow:auto}
.meth{background:var(--soft);border-left:6px solid var(--red);padding:12px 14px;margin:10px 0;border-radius:3px}
.meth ol{margin:6px 0;padding-left:22px}
.ex{border-left-color:var(--gold)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:12px}
.bcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--soft);border:3px solid var(--line);border-radius:6px;padding:12px}
.bcard b{font-size:11px}.bcard small{font-size:14px;line-height:1.35}.bcard.unk{opacity:.85}.bno{position:absolute;left:8px;top:8px;font-size:9px;opacity:.7}
.btype{font-size:13px;font-weight:700;background:var(--panel);border:2px solid var(--line);border-radius:3px;padding:1px 6px}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.shop .box{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:14px}

@media(max-width:600px){.banner{grid-template-columns:minmax(0,1fr)}.stat{min-width:0;font-size:8px;padding:6px}.qtext{font-size:18px}.grid{grid-template-columns:repeat(10,minmax(0,1fr))}.dialog{padding:14px}}

<body>
<div id="app"></div>
<div id="intro" class="intro" aria-live="polite"></div>
<div id="modal" role="dialog" aria-modal="true"><div class="box" id="mbox"></div></div>
<script>
{
/*DATA*/
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const P=a=>a[Math.floor(Math.random()*a.length)];
const SH=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rd=(x,d=0)=>{const f=10**d,v=+(x*f).toPrecision(12);return Math.sign(v)*Math.round(Math.abs(v))/f};
const fr=x=>String(+(+x).toPrecision(12)).replace('.',',');
const L=x=>fr(x).replace(',','{,}');
const pct=x=>fr(x)+' %';
const m=(s,...v)=>'\\('+String.raw(s,...v)+'\\)';
const N=(q,ans,o={})=>({t:'num',q,ans,...o});
const C=(q,good,bad,o={})=>({t:'qcm',q,good,choices:SH([good,...bad]),...o});
const G=(q,ans,pre,o={})=>({t:'grid',q,ans,pre,...o});
const U=(q,fields,o={})=>({t:'multi',q,fields,...o});
const tb=(h,rows)=>`<div class="scroll"><table class="tb"><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map((x,i)=>i?`<td>${x}</td>`:`<th>${x}</th>`).join('')}</tr>`).join('')}</table></div>`;
const up_=t=>1+t/100, dn_=t=>1-t/100;

/* ---------- MÉTHODES (fiches du cours) ---------- */
const METH=[
`<div class="meth"><b>Propriété — Proportions d'ensembles emboîtés</b><br>On a trois ensembles ${m`C\subset B\subset A`}.<br>${m`p`} = proportion de B dans A, ${m`p'`} = proportion de C dans B.<br>Alors la proportion de C dans A est ${m`p\times p'`}.</div>
<div class="meth"><b>Méthode</b><ol><li>Je repère A (le grand ensemble), B (celui du milieu) et C (le plus petit).</li><li>J'écris ${m`p`} et ${m`p'`} en nombres décimaux ou en fractions.</li><li>Je multiplie : ${m`p\times p'`}, puis je convertis en %.</li></ol></div>
<div class="meth ex"><b>Exemple</b><br>40 % des viennoiseries sont des croissants, 20 % des croissants sont aux amandes :<br>${m`0{,}4\times 0{,}2=0{,}08`} soit 8 % des viennoiseries.</div>`,
`<div class="meth"><b>Propriété — Coefficient multiplicateur</b><br>Augmenter de ${m`t\,\%`}, c'est multiplier par ${m`c=1+\frac{t}{100}`}.<br>Diminuer de ${m`t\,\%`}, c'est multiplier par ${m`c=1-\frac{t}{100}`}.<br>Valeur d'arrivée : ${m`V_A=V_D\times c`}.</div>
<div class="meth"><b>Méthode</b><ol><li>Hausse ou baisse ? Je choisis le signe + ou −.</li><li>Je calcule ${m`c`} (${m`c>1`} : hausse, ${m`c<1`} : baisse).</li><li>Je multiplie la valeur de départ par ${m`c`}. Pour retrouver la valeur de départ : ${m`V_D=V_A\div c`}.</li></ol></div>
<div class="meth ex"><b>Exemple</b><br>Une console à 400 € baisse de 15 % : ${m`c=1-\frac{15}{100}=0{,}85`} et ${m`400\times0{,}85=340`} €.</div>`,
`<div class="meth"><b>Définition — Variations</b><br>Une quantité passe de ${m`V_D`} (départ) à ${m`V_A`} (arrivée).<br>Variation absolue : ${m`V_A-V_D`}.<br>Variation relative (taux d'évolution) : ${m`\dfrac{V_A-V_D}{V_D}=c-1`}.</div>
<div class="meth"><b>Méthode</b><ol><li>Je repère bien ${m`V_D`} (avant) et ${m`V_A`} (après).</li><li>Variation absolue : arrivée moins départ (avec l'unité).</li><li>Variation relative : je divise par la valeur de <b>départ</b>, puis ×100 pour avoir des %. Négatif = baisse.</li></ol></div>
<div class="meth ex"><b>Exemple</b><br>Salaire : 1 500 € → 1 200 €. Absolue : ${m`1200-1500=-300`} €. Relative : ${m`\frac{-300}{1500}=-0{,}2`} soit −20 %.</div>`,
`<div class="meth"><b>Définition — Évolutions successives</b><br>Deux évolutions de coefficients ${m`c_1`} puis ${m`c_2`} :<br>${m`c_{\text{global}}=c_1\times c_2`} et ${m`T_{\text{global}}=c_{\text{global}}-1`}.</div>
<div class="meth"><b>Méthode</b><ol><li>Je calcule ${m`c_1`} et ${m`c_2`}.</li><li>Je les <b>multiplie</b> (on n'additionne jamais les pourcentages !).</li><li>J'enlève 1 et je convertis en %.</li></ol></div>
<div class="meth ex"><b>Exemple</b><br>+30 % puis −10 % : ${m`1{,}3\times0{,}9=1{,}17`} donc ${m`T=1{,}17-1=0{,}17`} soit +17 % (et pas +20 %).</div>`,
`<div class="meth"><b>Définition — Évolution réciproque</b><br>Pour revenir de ${m`V_A`} à ${m`V_D`} : ${m`c_{\text{réciproque}}=\dfrac{1}{c}`} et ${m`t_{\text{réciproque}}=c_{\text{réciproque}}-1`}.</div>
<div class="meth"><b>Méthode</b><ol><li>Je calcule le coefficient ${m`c`} de l'évolution de départ.</li><li>Je calcule ${m`\frac{1}{c}`}.</li><li>J'enlève 1 et je convertis en %. Attention : on ne retrouve pas le même pourcentage !</li></ol></div>
<div class="meth ex"><b>Exemple</b><br>Hausse de 25 % : ${m`c=1{,}25`}, ${m`\frac{1}{1{,}25}=0{,}8`}, ${m`0{,}8-1=-0{,}2`} : il faut une baisse de 20 %.</div>`

 drawMap(document.getElementById('mc'));renderPanel()}
function renderPanel(){const el=document.getElementById('panel');if(!el)return;const p=me(),t=TOWNS[SEL],open=townOpen(p,SEL),v=comp(p,t.id);
 el.innerHTML=`<div class="row" style="gap:14px">${champBust(SEL,2)}<div><h2 style="margin-bottom:6px">${esc(t.name)}</h2><b>${esc(t.theme)}</b><br><span class="note">${esc(CTITLE[SEL])}</span></div></div>
 <div class="row" style="margin-top:10px">${badgeSvg(t.col,p.badges.includes(t.id),4)}<span>${esc(t.badge)} ${p.badges.includes(t.id)?'— obtenu !':''}</span></div>
 <p style="margin-bottom:0"><b>Compréhension</b></p>${meter(v)}
 <div class="row" style="margin-top:14px">${open?`<button class="btn main" data-a="enter">Entrer</button>`:`<span class="note">${SEL===5?'Gagne les 5 badges pour ouvrir la Ligue.':'Gagne le badge de la ville précédente pour ouvrir cette ville.'}</span>`}</div>`;
 document.querySelectorAll('.tz').forEach((b,i)=>b.classList.toggle('on',i===SEL));document.querySelectorAll('#tbtns .btn').forEach((b,i)=>b.classList.toggle('on',i===SEL))}

/* ---------- ENTRÉE EN COMBAT ---------- */
let INTRO_CB=null;
function intro(ti,li,cb){const t=TOWNS[ti],l=t.lv[li],p=me(),el=document.getElementById('intro'),rm=matchMedia('(prefers-reduced-motion:reduce)').matches,ci=ti===5&&!l.council?5:ti;
 const vs=l.boss?`<div class="vs" style="--c:${t.col}"><div class="vsband"></div><div class="vsP">${trainerBust(p.g,outfit(p),5)}<span>${esc(p.name)}</span></div><div class="vsT px">VS</div>
 <div class="vsC"><div class="row ${l.council?'crew':''}" style="justify-content:center">${l.council?[0,1,2,3,4].map(k=>champBust(k,3)).join(''):champBust(ci,5)}</div><span>${l.council?'Le Conseil des Champions':esc(CTITLE[ci])}</span></div>
 <div class="vsQ box"><p style="margin-top:0">« ${esc(l.council?'Nous sommes cinq, et chacun te posera deux questions. Prêt ?':QUOTES[ci])} »</p><button class="btn main" data-a="fight">Combattre !</button></div></div>`:'';
 el.innerHTML=(rm?'':`<div class="fl"></div><div class="bars">${Array.from({length:10},(_,k)=>`<i style="animation-delay:${(.8+k*.05).toFixed(2)}s"></i>`).join('')}</div>`)+vs;
 el.className='intro on'+(rm?' rm':'');INTRO_CB=cb;
 if(!l.boss)setTimeout(()=>{cb();closeIntro()},rm?0:1500);else setTimeout(()=>{const b=el.querySelector('[data-a=fight]');b&&b.focus()},rm?0:2500)}
function closeIntro(){const el=document.getElementById('intro');el.classList.add('out');setTimeout(()=>{el.className='intro';el.innerHTML=''},350)}

function townScreen(ti,withMethod){CT=ti;const p=me(),t=TOWNS[ti],v=comp(p,t.id);
 const cards=t.lv.map((l,li)=>{const o=lvlOpen(p,ti,li),st=p.done[lkey(ti,li)]||0;return `<button class="btn lvl ${l.boss?'boss':''}" data-a="play" data-l="${li}" ${o?'':'disabled'}><span class="sk">${l.sk}</span><b>${esc(l.n)}</b><span class="row">${foeSpr(l.boss?l.foe:HAB[ti][li%HAB[ti].length],3)}<span>${[1,2,3].map(i=>`<span style="color:${i<=st?'var(--gold)':'#999'}">★</span>`).join('')}</span></span><small>${o?(st?'Terminé — rejouer':'À faire'):'Verrouillé'}${l.boss?' · Badge':''}</small></button>`}).join('');
 show(hud(p)+`<div class="banner" style="background:${t.col}">${champBust(ti===5?5:ti,3)}<div><h1>${esc(t.name)}</h1><p style="margin:0"><b>${esc(t.theme)}</b> — Champion ${esc(t.champ)}</p></div></div>
 <div class="box"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Les épreuves</h2><button class="btn gold" data-a="meth" data-t="${ti}">Méthode du cours</button></div>
 <div class="lvls">${cards}</div><p style="margin-bottom:0"><b>Ma compréhension de cette ville</b></p>${meter(v)}
 <p class="note">Chaque épreuve : 3 vies. 1re erreur → un indice. 2e erreur → tu perds une vie. Plus de vies → tu es éjecté de la ville et tu peux recommencer.</p></div>`);
 if(withMethod)methodModal(ti,true)}
function methodModal(ti,start){openModal(`<h2>${start?'Avant de commencer : ':''}la méthode</h2><p><b>${esc(TOWNS[ti].name)} — ${esc(TOWNS[ti].theme)}</b></p>${METH[ti]}<div class="row" style="margin-top:12px"><button class="btn main" data-a="close">${start?'Commencer':'Fermer'}</button></div>`)}

function play(ti,li){const qs=buildLevel(ti,li),l=TOWNS[ti].lv[li],foe=l.boss?l.foe:P(HAB[ti]),p=me();S={ti,li,qs,i:0,lives:3,tries:0,done:false,scores:[],xp:0,foe};
 if(!l.boss){p.seen=p.seen||{};p.seen[foe]=1;save()}renderQ()}
function renderQ(){const p=me(),t=TOWNS[S.ti],l=t.lv[S.li],q=S.qs[S.i],foe=q.foe||S.foe,n=S.qs.length;
 const fname=/^champ\d$/.test(foe)?(q.who||t.champ):BX[foe].n+' sauvage';
 show(`<div class="row" style="justify-content:space-between;margin-bottom:10px"><button class="btn" data-a="quit">Fuir</button><span class="chip">${esc(t.name)} · ${esc(l.n)}</span></div>
 <div class="field" id="fld"><canvas id="fc" aria-hidden="true"></canvas>
 <div class="foe ${/^champ\d$/.test(foe)?'ch':''}" id="foe">${foeSpr(foe,/^champ\d$/.test(foe)?6:7)}</div><div class="bud">${crSpr(p.buddy,3)}</div>
 <div class="stat top">${esc(fname)}<div class="hp"><i style="width:${(n-S.i)/n*100}%"></i></div></div>
 <div class="stat bot">${esc(p.name)} · Q ${S.i+1}/${n}<div class="hearts">${[0,1,2].map(i=>heart(i<S.lives)).join('')}</div></div></div>
 <div class="dialog"><div class="qhead"><span class="tag">${esc(q.sk||l.sk)}</span><button class="btn gold" data-a="meth" data-t="${S.ti}" style="font-size:10px">Aide</button></div>
 <div class="qtext">${q.q}</div><div id="zone">${zone(q)}</div><div id="fb"></div></div>`);
 drawField(document.getElementById('fc'),S.ti);const f=app.querySelector('#zone input');f&&f.focus();bindGrid()}
function zone(q){if(q.t==='num')return `<div class="ans"><input id="in" type="text" inputmode="decimal" autocomplete="off" aria-label="Ta réponse">${q.u?`<span class="unit">${esc(q.u)}</span>`:''}<button class="btn main" data-a="ok">Valider</button></div><p class="note">Tu peux écrire 12,5 ou 12.5 ou une fraction comme 1/8.</p>`;
 if(q.t==='qcm')return `<div class="choices">${q.choices.map((c,i)=>`<button class="choice" data-a="ch" data-i="${i}">${c}</button>`).join('')}</div>`;
 if(q.t==='multi')return `<div class="mf">${q.fields.map((f,i)=>`<label>${f.l} <input type="text" inputmode="decimal" autocomplete="off" data-f="${i}"> ${f.u?`<span class="unit">${esc(f.u)}</span>`:''}</label>`).join('')}</div><button class="btn main" data-a="ok">Valider</button>`;
 if(q.t==='grid')return `<div class="grid" id="grid">${Array.from({length:100},(_,i)=>`<button class="cell ${i<q.pre?'pre':''}" data-c="${i}" aria-label="case ${i+1}"></button>`).join('')}</div><div class="row"><span class="chip" id="cnt">Cases coloriées : 0</span><button class="btn" data-a="clr">Effacer</button><button class="btn main" data-a="ok">Valider</button></div>`}
let paint=null;
function bindGrid(){const g=document.getElementById('grid');if(!g)return;
 const set=(c,v)=>{if(S.done)return;c.classList.toggle('on',v);document.getElementById('cnt').textContent='Cases coloriées : '+g.querySelectorAll('.on').length};
 g.addEventListener('pointerdown',e=>{const c=e.target.closest('.cell');if(!c)return;e.preventDefault();paint=!c.classList.contains('on');set(c,paint)});
 g.addEventListener('pointerover',e=>{if(paint===null)return;const c=e.target.closest('.cell');if(c)set(c,paint)});
 g.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('cell')){e.preventDefault();set(e.target,!e.target.classList.contains('on'))}});
 window.addEventListener('pointerup',()=>paint=null)}

function answer(ch){if(S.done)return;const q=S.qs[S.i];let res='no',extra='';
 if(q.t==='num'){const v=parseNum(document.getElementById('in').value);res=judge(v,q.ans,tolOf(q),q.u,q.alt);if(res==='nan'){fb('hint','Écris un nombre',`Je n'ai pas compris ta réponse. Écris seulement un nombre (exemple : 12,5).`);return}
  if(res==='okpct'){res='ok';extra=`<br><i>Juste ! Pense à l'écrire en pourcentage : ${pct(rd(q.ans,4))}.</i>`}}
 else if(q.t==='qcm'){res=q.choices[ch]===q.good?'ok':'no';const b=app.querySelectorAll('.choice')[ch];b.classList.add(res==='ok'?'yes':'no');if(res!=='ok')b.disabled=true}
 else if(q.t==='multi'){const ins=[...app.querySelectorAll('.mf input')];let all=true,any=false;
  ins.forEach((el,i)=>{const f=q.fields[i],v=parseNum(el.value),r=judge(v,f.ans,f.tol??Math.max(1e-6,Math.abs(f.ans)*1e-6),f.u);const g=r==='ok'||r==='okpct';el.classList.toggle('good',g);el.classList.toggle('wrong',!g);if(!g)all=false;if(el.value.trim())any=true});
  if(!any){fb('hint','Complète les cases','Remplis toutes les cases avant de valider.');return}res=all?'ok':'no';if(!all)extra='<br>Les cases bordées de rouge sont fausses, les vertes sont justes.'}
 else if(q.t==='grid'){const on=[...app.querySelectorAll('.cell.on')].map(c=>+c.dataset.c);const inB=on.every(i=>i<q.pre);
  if(on.length===q.ans&&inB)res='ok';else if(on.length===q.ans&&!inB){res='no';extra='<br>Le bon nombre de cases, mais C doit être <b>à l’intérieur</b> de la zone verte (B).'}}
 if(res==='ok'){const sc=S.tries===0?1:0.5;S.scores.push(sc);S.xp+=S.tries===0?10:5;S.done=true;const fo=document.getElementById('foe');fo&&fo.classList.add('shake');
  fb('ok',S.tries===0?'Super efficace !':'Bien rattrapé !',(q.sol?'Correction : '+q.sol:'')+extra,true);return}
 if(S.tries===0){S.tries=1;const h=res==='sign'?'Attention au signe : une baisse donne un taux négatif (et une hausse un taux positif).':q.hint;fb('hint','Indice',h+extra);return}
 S.lives--;S.scores.push(0);S.done=true;const fl=document.getElementById('fld');fl&&fl.classList.add('flash');
 if(q.t==='qcm'){const gb=app.querySelectorAll('.choice')[q.choices.indexOf(q.good)];gb&&gb.classList.add('yes')}
 const sol=q.t==='num'?`La bonne réponse était <b>${fr(rd(q.ans,4))}${q.u?' '+esc(q.u):''}</b>. `:'';
 fb('bad','Tu perds une vie',sol+(q.sol?'Correction : '+q.sol:'')+extra,true)}
function fb(k,t,h,next){const el=document.getElementById('fb');el.innerHTML=`<div class="fb ${k}" role="status"><b>${t}</b>${h}</div>${next?`<div class="row" style="margin-top:12px"><button class="btn main" data-a="next">${S.lives<=0?'Continuer':S.i+1<S.qs.length?'Question suivante':'Terminer'}</button></div>`:''}`;tex(el);
 if(next){app.querySelectorAll('#zone input,#zone button:not(.choice),.choice').forEach(b=>b.disabled=true);const n=el.querySelector('[data-a=next]');n&&n.focus()}}
function next(){if(S.lives<=0)return endLevel(false);S.i++;S.tries=0;S.done=false;if(S.i>=S.qs.length)return endLevel(true);renderQ()}
function endLevel(win){const p=me(),t=TOWNS[S.ti],l=t.lv[S.li],k=lkey(S.ti,S.li);
 p.stats[t.id]=(p.stats[t.id]||[]).concat(S.scores).slice(-20);
 if(S.ti===5){/* la Ligue compte aussi pour chaque ville */}
 p.xp+=S.xp;let coins=0,newBadge=false;
 if(win&&!l.boss){p.beaten=p.beaten||{};p.beaten[S.foe]=1}
 if(win){const first=!p.done[k];coins=(l.boss?30:10)+5*S.lives;if(!first)coins=Math.ceil(coins/2);p.coins+=coins;p.done[k]=Math.max(p.done[k]||0,S.lives);
  if(l.boss&&(!t.league||l.d===CHEF)&&!p.badges.includes(t.id)){p.badges.push(t.id);newBadge=true}}
 save();const v=comp(p,t.id);
 show(hud(p)+`<div class="box" style="text-align:center"><div class="row" style="justify-content:center">${win?foeSpr(S.foe,5):crSpr(p.buddy,3)}</div>
 <h1>${win?(newBadge?(t.league?'Tu es Maître de Proportia !':'Tu gagnes le '+esc(t.badge)+' !'):'Victoire !'):'Tu es éjecté de '+esc(t.name)+' !'}</h1>
 ${newBadge?`<div class="row" style="justify-content:center">${badgeSvg(t.col,1,8)}</div>`:''}
 <p>${win?`${'★'.repeat(S.lives)} · +${coins} pièces · +${S.xp} XP`:`Tes vies sont épuisées. Relis la méthode, puis recommence : tu gardes ton XP (+${S.xp}).`}</p>
 <div style="max-width:420px;margin:0 auto;text-align:left"><b>Compréhension de ${esc(t.name)}</b>${meter(v)}</div>
 <div class="row" style="justify-content:center;margin-top:16px"><button class="btn main" data-a="replay">${win?'Rejouer':'Recommencer'}</button><button class="btn" data-a="town" data-t="${S.ti}">Retour à la ville</button>${!win?`<button class="btn gold" data-a="meth" data-t="${S.ti}">Revoir la méthode</button>`:''}</div></div>`)}

function bestScreen(){const p=me(),seen=p.seen||{},beat=p.beaten||{};const nSeen=BEST.filter(b=>seen[b.id]||STARTERS.includes(b.id)&&p.buddy===b.id).length;
 show(hud(p)+`<div class="box"><div class="row" style="justify-content:space-between"><h1 style="margin:0">Bestiaire de Proportia</h1><span class="chip">Vus ${nSeen}/${BEST.length} · Vaincus ${Object.keys(beat).length}</span></div>
 <p>Chaque épreuve fait apparaître une créature sauvage de la ville. Rencontre-les toutes pour remplir ton bestiaire !</p>
 <div class="bgrid">${BEST.map((b,i)=>{const k=seen[b.id]||p.buddy===b.id;return `<div class="bcard ${k?'':'unk'}"><span class="bno px">n°${String(i+1).padStart(2,'0')}</span>${k?crSpr(b.id,2):crSil(b.id,2)}
 <b class="px">${k?esc(b.n):'???'}</b>${k?`<span class="btype">${esc(b.t)}</span><small>${esc(b.d)}</small><small class="note">Habitat : ${esc(habOf(b.id)||'—')}${STARTERS.includes(b.id)?' · Compagnon de départ':''}</small>${beat[b.id]?'<span class="chip" style="font-size:9px">Vaincu</span>':''}`:`<small class="note">Pas encore rencontré${habOf(b.id)?' · Indice : '+esc(habOf(b.id).split(',')[0]):''}</small>`}</div>`}).join('')}</div></div>`)}
function profileScreen(){const p=me();
 show(hud(p)+`<div class="box"><div class="row" style="gap:20px">${bigTrainer(p.g,outfit(p),4)}${crSpr(p.buddy,3)}<div><h1>${esc(p.name)}</h1><p>${p.g==='f'?'Dresseuse':'Dresseur'} · Niveau ${lvlOf(p)} · ${p.xp} XP · ${p.coins} pièces</p><div class="meter" style="max-width:260px"><i style="width:${p.xp%100}%"></i></div><p class="note">${100-p.xp%100} XP avant le niveau ${lvlOf(p)+1}</p></div></div>
 <h2 style="margin-top:18px">Ma compréhension, ville par ville</h2>
 <div class="lvls">${TOWNS.map((t,i)=>`<div class="box" style="padding:12px"><div class="row">${badgeSvg(t.col,p.badges.includes(t.id),3)}<b>${esc(t.name)}</b></div><p class="note" style="margin:6px 0">${esc(t.theme)}</p>${meter(comp(p,t.id))}</div>`).join('')}</div>
 <h3>Compagnon de départ</h3><div class="pick">${STARTERS.map(k=>`<button class="btn" data-a="setbud" data-v="${k}" aria-pressed="${p.buddy===k}">${crSpr(k,2)}${BX[k].n}</button>`).join('')}</div>
 <div class="row"><button class="btn" data-a="home">Changer de joueur</button></div></div>`)}

function shopScreen(){const p=me();
 show(hud(p)+`<div class="box"><h1>Boutique de tenues</h1><p>Gagne des pièces en terminant les épreuves, puis change de style !</p><div class="shop">${OUTFITS.map(o=>{const own=p.owned.includes(o.id),on=p.outfit===o.id;
 return `<div class="box">${bigTrainer(p.g,o,3)}<b class="px" style="font-size:11px">${esc(o.n)}</b><span>${o.pr?o.pr+' pièces':'Gratuit'}</span>${on?'<span class="chip">Portée</span>':own?`<button class="btn" data-a="wear" data-v="${o.id}">Porter</button>`:`<button class="btn main" data-a="buy" data-v="${o.id}" ${p.coins<o.pr?'disabled':''}>Acheter</button>`}</div>`}).join('')}</div></div>`)}

function teachLogin(){openModal(`<h2>Mode prof</h2><label for="code">Code d'accès</label><br><input id="code" type="password" autocomplete="off"><p id="cerr" class="note"></p><div class="row"><button class="btn main" data-a="tcheck">Valider</button><button class="btn" data-a="close">Annuler</button></div>`)}
function teachPanel(){const rows=DB.profiles.map(p=>`<tr><td><b>${esc(p.name)}</b><br><span class="note">Niv. ${lvlOf(p)} · ${p.badges.filter(b=>b!=='lg').length} badges</span></td>${TOWNS.map(t=>{const v=comp(p,t.id);return `<td>${v===null?'—':`<span class="mini"><i style="width:${v}%;background:${v<40?'var(--bad)':v<70?'var(--warn)':'var(--ok)'}"></i></span> ${v} %`}</td>`}).join('')}<td><button class="btn" data-a="del" data-id="${esc(p.id)}" style="font-size:9px;min-height:36px;padding:6px 8px">Supprimer</button></td></tr>`).join('');
 openModal(`<h2>Mode prof activé</h2><p>Toutes les villes et épreuves sont ouvertes pour ce navigateur jusqu'à ce que tu quittes le mode prof.</p>
 <h3>Profils sur cet appareil</h3><div class="scroll"><table class="ptable"><tr><th>Élève</th>${TOWNS.map((t,i)=>`<th>${i<5?'V'+(i+1):'Ligue'}</th>`).join('')}<th></th></tr>${rows||'<tr><td colspan="8">Aucun profil.</td></tr>'}</table></div>
 <p class="note">V1 Emboîtés · V2 Coefficients · V3 Variations · V4 Successives · V5 Réciproque</p>
 <div class="row"><button class="btn main" data-a="tgo">Explorer le jeu</button></div>`)}
function teachProfile(){if(!DB.profiles.some(p=>p.id==='prof')){DB.profiles.push(newP('Prof','f','spiralo','prof'));save()}if(!me())DB.cur='prof'}
function newP(name,g,buddy,id){return {id:id||('p'+Date.now().toString(36)),name,g,buddy,outfit:'classique',owned:['classique'],coins:0,xp:0,badges:[],done:{},stats:{}}}

/* ---------- ÉVÉNEMENTS ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,p=me();
 switch(a){
 case 'home':title();break;case 'new':draft={g:'m',buddy:'pousserave',name:''};create();break;
 case 'dg':draft.g=b.dataset.v;create();break;case 'db':draft.buddy=b.dataset.v;create();break;
 case 'mk':{const n=draft.name.trim();if(!n){document.getElementById('err').textContent='Écris ton prénom pour continuer.';return}const np=newP(n,draft.g,draft.buddy);DB.profiles.push(np);DB.cur=np.id;save();SEL=0;mapScreen();break}
 case 'pick':DB.cur=b.dataset.id;save();SEL=0;mapScreen();break;
 case 'map':mapScreen();break;case 'profile':profileScreen();break;case 'shop':shopScreen();break;case 'best':bestScreen();break;
 case 'sel':walkTo(+b.dataset.i);break;
 case 'enter':townScreen(SEL,true);break;case 'town':townScreen(+b.dataset.t);break;
 case 'meth':methodModal(+b.dataset.t,false);break;case 'close':closeModal();break;
 case 'play':{const li=+b.dataset.l,ti=CT;intro(ti,li,()=>play(ti,li));break}
 case 'fight':{const cb=INTRO_CB;INTRO_CB=null;cb&&cb();closeIntro();break}
 case 'ok':answer();break;case 'ch':answer(+b.dataset.i);break;case 'next':next();break;
 case 'clr':if(!S.done){app.querySelectorAll('.cell.on').forEach(c=>c.classList.remove('on'));document.getElementById('cnt').textContent='Cases coloriées : 0'}break;
 case 'quit':openModal(`<h2>Fuir le combat ?</h2><p>Ta progression dans cette épreuve sera perdue.</p><div class="row"><button class="btn main" data-a="quitok">Fuir</button><button class="btn" data-a="close">Rester</button></div>`);break;
 case 'quitok':closeModal();townScreen(S.ti);break;
 case 'replay':{const ti=S.ti,li=S.li;intro(ti,li,()=>play(ti,li));break}
 case 'setbud':p.buddy=b.dataset.v;save();profileScreen();break;
 case 'buy':{const o=OUTFITS.find(x=>x.id===b.dataset.v);if(p.coins>=o.pr){p.coins-=o.pr;p.owned.push(o.id);p.outfit=o.id;save()}shopScreen();break}
 case 'wear':p.outfit=b.dataset.v;save();shopScreen();break;
 case 'teach':teachLogin();break;
 case 'tcheck':{const c=document.getElementById('code').value.trim().toUpperCase();if(c==='TSITSEL'){TEACH=true;teachPanel()}else document.getElementById('cerr').textContent='Code incorrect.';break}
 case 'tgo':closeModal();teachProfile();mapScreen();break;
 case 'teachoff':TEACH=false;me()?mapScreen():title();break;
 case 'del':{const id=b.dataset.id;if(b.dataset.sure){DB.profiles=DB.profiles.filter(x=>x.id!==id);if(DB.cur===id)DB.cur=null;save();teachPanel()}else{b.dataset.sure=1;b.textContent='Confirmer ?'}break}
 }});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='code'){e.preventDefault();document.querySelector('[data-a=tcheck]').click()}else if(e.target.matches('#zone input')){e.preventDefault();const n=document.querySelector('[data-a=next]');(n||document.querySelector('#zone [data-a=ok]')).click()}}
 if(app.querySelector('.map')&&!modal.classList.contains('open')&&(e.key==='ArrowRight'||e.key==='ArrowLeft')&&!e.target.matches('input')){walkTo((SEL+(e.key==='ArrowRight'?1:5))%6)}});
title();
}
</script>
</body>
</html>
