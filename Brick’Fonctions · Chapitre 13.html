<script>{
/* ===== LOGIQUE PURE (testable) ===== */
const MINUS = '−';
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function fnum(v){ // nombre au format français
  if(v===Infinity)return '+∞'; if(v===-Infinity)return MINUS+'∞';
  const s=(Math.round(v*100)/100).toString().replace('.',',');return s.replace('-',MINUS);}

/* --- Fonctions de référence : f(x) = a·base(x − h) + k --- */
const BASES={
  lin:{nom:'x (affine)',f:u=>u},
  sq:{nom:'x²',f:u=>u*u},
  cube:{nom:'x³',f:u=>u*u*u},
  sqrt:{nom:'√x',f:u=>u>=0?Math.sqrt(u):NaN},
  inv:{nom:'1/x',f:u=>u!==0?1/u:NaN}
};
function evalP(p,x){const v=BASES[p.base].f(x-p.h);return isNaN(v)?NaN:p.a*v+p.k;}
function inner(h){return h===0?'x':(h>0?'x '+MINUS+' '+h:'x + '+(-h));}
function coefStr(a){return a===1?'':a===-1?MINUS:fnum(a);}
function exprHTML(p){
  const X=inner(p.h);let t;
  if(p.base==='lin'){t=p.h===0?coefStr(p.a)+'x':coefStr(p.a)+'('+X+')';}
  else if(p.base==='sq'){t=coefStr(p.a)+(p.h===0?'x<sup>2</sup>':'('+X+')<sup>2</sup>');}
  else if(p.base==='cube'){t=coefStr(p.a)+(p.h===0?'x<sup>3</sup>':'('+X+')<sup>3</sup>');}
  else if(p.base==='sqrt'){t=coefStr(p.a)+'<span class="rad">√<span>'+X+'</span></span>';}
  else {const num=Math.abs(p.a)===1?'1':fnum(Math.abs(p.a));t=(p.a<0?MINUS:'')+'<span class="frac"><span>'+num+'</span><span>'+X+'</span></span>';}
  if(p.k>0)t+=' + '+p.k; else if(p.k<0)t+=' '+MINUS+' '+(-p.k);
  return t;}
function sameFunction(p,q){
  for(let x=-5;x<=5.0001;x+=0.25){const u=evalP(p,x),v=evalP(q,x);
    if(isNaN(u)!==isNaN(v))return 'domaine'; if(!isNaN(u)&&Math.abs(u-v)>1e-7)return 'valeur';}
  return 'ok';}

const M1POOL=[
 [ {a:1,base:'sq',h:0,k:0},{a:1,base:'cube',h:0,k:0},{a:1,base:'sqrt',h:0,k:0},{a:1,base:'inv',h:0,k:0},
   {a:2,base:'lin',h:0,k:1},{a:-1,base:'lin',h:0,k:3},{a:1,base:'lin',h:0,k:-2},{a:-2,base:'lin',h:0,k:-1},{a:0.5,base:'lin',h:0,k:1},{a:3,base:'lin',h:0,k:-2} ],
 [ {a:2,base:'sq',h:0,k:0},{a:-1,base:'sq',h:0,k:0},{a:1,base:'sq',h:0,k:-3},{a:-1,base:'sq',h:0,k:4},{a:1,base:'cube',h:0,k:1},
   {a:-1,base:'cube',h:0,k:0},{a:2,base:'sqrt',h:0,k:0},{a:1,base:'sqrt',h:0,k:1},{a:-1,base:'sqrt',h:0,k:0},{a:1,base:'inv',h:0,k:1},
   {a:-1,base:'inv',h:0,k:0},{a:2,base:'inv',h:0,k:0},{a:1,base:'cube',h:0,k:-2},{a:1,base:'sq',h:0,k:1} ],
 [ {a:1,base:'sq',h:1,k:0},{a:1,base:'sq',h:-2,k:0},{a:1,base:'sq',h:2,k:-3},{a:-1,base:'sq',h:1,k:4},{a:1,base:'sqrt',h:-2,k:0},
   {a:1,base:'sqrt',h:1,k:1},{a:1,base:'inv',h:2,k:0},{a:1,base:'inv',h:-1,k:-2},{a:1,base:'cube',h:1,k:0},{a:-1,base:'sqrt',h:0,k:2},{a:2,base:'sq',h:0,k:-4} ]
];

/* --- Interpolation monotone (Fritsch–Carlson) pour les courbes de la manche 2 --- */
function spline(x0,ys){
  const n=ys.length,d=[],m=new Array(n);
  for(let i=0;i<n-1;i++)d.push(ys[i+1]-ys[i]);
  m[0]=d[0];m[n-1]=d[n-2];
  for(let i=1;i<n-1;i++)m[i]=(d[i-1]*d[i]<=0)?0:(d[i-1]+d[i])/2;
  for(let i=0;i<n-1;i++){const al=m[i]/d[i],be=m[i+1]/d[i],s=al*al+be*be;if(s>9){const t=3/Math.sqrt(s);m[i]=t*al*d[i];m[i+1]=t*be*d[i];}}
  const x1=x0+n-1;
  return function(x){
    if(x<x0-1e-9||x>x1+1e-9)return NaN;
    let i=Math.floor(x-x0);if(i>=n-1)i=n-2;if(i<0)i=0;
    const t=x-x0-i;if(t===0)return ys[i];
    const t2=t*t,t3=t2*t;
    return (2*t3-3*t2+1)*ys[i]+(t3-2*t2+t)*m[i]+(-2*t3+3*t2)*ys[i+1]+(t3-t2)*m[i+1];};
}
const M2CURVES=[
 {x0:-4,ys:[3,1,-1,1,3,2,1,0,-2]},{x0:-3,ys:[-2,0,2,4,2,0,-1,0,1]},{x0:-4,ys:[4,2,0,-2,-3,-2,0,2,3]},
 {x0:-2,ys:[0,2,3,2,0,-2,0,1]},{x0:-5,ys:[-1,1,2,1,-1,-3,-1,1,3]},{x0:-3,ys:[1,3,1,-1,-3,-1,1,2]}
];
// Deux courbes : g affine, f = g + H (H s'annule seulement aux noeuds)
const M2PAIRS=[
 {x0:-3,hs:[-2,0,2,1,0,-1,-2,-1],m:-1,p:1},
 {x0:-2,hs:[2,0,-2,-1,0,1,0,-1],m:1,p:-1},
 {x0:-4,hs:[1,0,-1,-2,-1,0,2,3],m:-1,p:-1}
];
function validKs(ys){const r=[];for(let k=-5;k<=5;k++){if(k<Math.min(...ys)||k>Math.max(...ys))continue;
  let ok=true;for(let i=0;i<ys.length-1;i++){const a=ys[i],b=ys[i+1];if(Math.min(a,b)<k&&k<Math.max(a,b))ok=false;}if(ok)r.push(k);}return r;}
function cmp(op,u,v){const e=1e-7;switch(op){case '=':return Math.abs(u-v)<e;case '≥':return u>v-e;case '>':return u>v+e;case '≤':return u<v+e;case '<':return u<v-e;}}

/* --- Ensembles de solutions --- */
// pièce : {t:'pt',a} ou {t:'int',lb:'['|']',a,b,rb}
function inSet(pieces,x){return pieces.some(p=>{
  if(p.t==='pt')return Math.abs(x-p.a)<1e-9;
  const L=p.a===-Infinity?true:(p.lb==='['?x>=p.a-1e-9:x>p.a+1e-9);
  const R=p.b===Infinity?true:(p.rb===']'?x<=p.b+1e-9:x<p.b-1e-9);return L&&R;});}
function setProblems(pieces){const pb=[];
  pieces.forEach(p=>{if(p.t!=='int')return;
    if(p.a===undefined||p.b===undefined||p.a===null||p.b===null){pb.push('Une borne n’est pas choisie.');return;}
    if(p.a>=p.b)pb.push('Dans un intervalle, la borne de gauche doit être plus petite que celle de droite.');
    if((p.a===-Infinity&&p.lb==='[')||(p.b===Infinity&&p.rb===']'))pb.push('Le crochet est toujours ouvert du côté de l’infini.');
    if(p.a===Infinity||p.b===-Infinity)pb.push('−∞ se place à gauche, +∞ à droite.');});
  return [...new Set(pb)];}
function sameSet(pieces,truth,lo,hi){for(let x=lo;x<=hi+1e-9;x+=0.25){if(inSet(pieces,x)!==truth(x))return false;}return true;}
// Reconstruit l'écriture d'un ensemble (bornes entières) par balayage
function solPieces(truth,lo,hi,infLo,infHi){
  const xs=[];for(let x=lo;x<=hi+1e-9;x+=0.25)xs.push(Math.round(x*4)/4);
  const res=[];let i=0;
  while(i<xs.length){if(!truth(xs[i])){i++;continue;}let j=i;while(j+1<xs.length&&truth(xs[j+1]))j++;
    const s=xs[i],e=xs[j];
    let a,lb,b,rb;
    if(infLo&&i===0){a=-Infinity;lb=']';}else if(Number.isInteger(s)){a=s;lb='[';}else{a=Math.floor(s);lb=']';}
    if(infHi&&j===xs.length-1){b=Infinity;rb='[';}else if(Number.isInteger(e)){b=e;rb=']';}else{b=Math.ceil(e);rb='[';}
    if(a===b&&lb==='['&&rb===']')res.push({t:'pt',a});else res.push({t:'int',lb,a,b,rb});
    i=j+1;}
  return res;}
function setStr(pieces,empty){
  if(empty||!pieces.length)return 'S = ∅';
  const pts=pieces.filter(p=>p.t==='pt'),ints=pieces.filter(p=>p.t==='int');
  const parts=ints.map(p=>p.lb+' '+fnum(p.a)+' ; '+fnum(p.b)+' '+p.rb);
  if(pts.length)parts.push('{ '+pts.map(p=>p.a).sort((u,v)=>u-v).map(fnum).join(' ; ')+' }');
  return 'S = '+parts.join(' ∪ ');}

/* --- Manche 3 : facteurs affines [a,b] = ax + b --- */
function affHTML(a,b){let s=a===1?'x':a===-1?MINUS+'x':a===0.5?'½x':fnum(a)+'x';
  if(b>0)s+=' + '+b;else if(b<0)s+=' '+MINUS+' '+(-b);return s;}
function par(f){return (f[1]===0&&f[0]>0&&f[0]!==0.5)?affHTML(f[0],0):'('+affHTML(f[0],f[1])+')';}
function m3HTML(c){
  if(c.kind==='one')return affHTML(c.f[0][0],c.f[0][1]);
  if(c.kind==='prod')return par(c.f[0])+par(c.f[1]);

const MOTS=['Renard','Castor','Hibou','Loutre','Panda','Koala','Lynx','Morse','Zèbre','Bison','Puma','Tapir','Gecko','Héron','Lama','Phoque','Orque','Blaireau','Marmotte','Chamois','Pélican','Iguane','Faucon','Hérisson'];

function makeCard(code,manche,i){
  const L=level(i),key=code+'|'+manche,r=rng(hashStr(key+'|'+i));
  const mot=MOTS[hashStr(key+'#'+i)%MOTS.length];
  const pick=(pool)=>{const sh=shuffle(pool.map((_,j)=>j),rng(hashStr(key+'|L'+L)));return pool[sh[rankIn(i)%pool.length]];};
  const base={i,L,mot,manche};
  if(manche===1)return Object.assign(base,{p:pick(M1POOL[L])});
  if(manche===2){
    if(L<2){const c=pick(M2CURVES),ks=validKs(c.ys);
      const k=ks[Math.floor(r()*ks.length)];
      const op=L===0?'=':['≥','>','≤','<'][Math.floor(r()*4)];
      const f=spline(c.x0,c.ys);
      return Object.assign(base,{two:false,x0:c.x0,x1:c.x0+c.ys.length-1,ys:c.ys,k,op,f,truth:x=>{const v=f(x);return !isNaN(v)&&cmp(op,v,k);}});}
    const c=pick(M2PAIRS),H=spline(c.x0,c.hs),g=x=>c.m*x+c.p,x1=c.x0+c.hs.length-1;
    const f=x=>{const h=H(x);return isNaN(h)?NaN:g(x)+h;};
    const op=['=','≥','<','≤','>'][Math.floor(r()*5)];
    return Object.assign(base,{two:true,x0:c.x0,x1,f,g:x=>(x<c.x0-1e-9||x>x1+1e-9)?NaN:g(x),m:c.m,pp:c.p,op,
      nodes:c.hs.map((h,j)=>[c.x0+j,g(c.x0+j)+h]),truth:x=>{const v=f(x);return !isNaN(v)&&cmp(op,v,g(x));}});}
  const fl=pick(M3POOL[L]),kind=L===0?'one':L===1?'prod':'quot';

  s+='<line class="ax" x1="'+pad+'" x2="'+(W-pad)+'" y1="'+Y(0)+'" y2="'+Y(0)+'"/><line class="ax" x1="'+X(0)+'" x2="'+X(0)+'" y1="'+pad+'" y2="'+(H-pad)+'"/>';

    for(let y=Math.ceil(ym);y<=yM;y++)if(y!==0)s+='<text class="tk" x="'+(X(0)-6)+'" y="'+(Y(y)+4)+'" text-anchor="end">'+fnum(y)+'</text>';

  s+='<g clip-path="url(#cp'+W+')">';
  (o.curves||[]).forEach(c=>{let d='',pen=false,py=null;const N=700;

    if(isFinite(p.b))s+='<circle class="'+(p.rb===']'?'solp':'solo')+'" cx="'+X(p.b)+'" cy="'+y0+'" r="7"/>';});}
  return '<div class="fig">'+s+'</svg></div>';}

    h+='<h3 style="margin-top:14px">3. Touche les cases pour remplir le tableau</h3><p class="muted">Case large : ? → + → −. Case sur un trait : rien → 0 → || (valeur interdite).</p>'+tableHTML(u.vals.slice().sort((a,b)=>a-b),u.rows,labs,!D);}
  if(c.op){h+='<h3 style="margin-top:14px">4. Résoudre E(x) '+c.op+' 0</h3>'+setBuilder(u,M3V,D);}
  return h+'</div>';}
function tableHTML(vals,rows,labs,edit){
  const m=vals.length;let h='<div class="scroll"><table class="st"><thead><tr><th>x</th>';
  for(let j=0;j<=m;j++){h+='<th class="iv"><div class="hd"><span>'+(j===0?MINUS+'∞':'')+'</span><span>'+(j===m?'+∞':'')+'</span></div></th>';if(j<m)h+='<th class="cvc">'+fnum(vals[j])+'</th>';}
  h+='</tr></thead><tbody>';
  rows.forEach((r,ri)=>{h+='<tr><td>'+labs[ri]+'</td>';
    for(let j=0;j<=m;j++){const v=r.iv[j];h+='<td class="iv">'+(edit?'<button data-act="cell" data-r="'+ri+'" data-t="iv" data-c="'+j+'" aria-label="signe">'+v+'</button>':'<button disabled>'+v+'</button>')+'</td>';
      if(j<m){const w=r.cv[j];h+='<td class="cvc'+(w==='||'?' dbl':'')+'">'+(edit?'<button data-act="cell" data-r="'+ri+'" data-t="cv" data-c="'+j+'" aria-label="valeur charnière">':'<button disabled>')+(w==='0'?'<span>0</span>':'')+'</button></td>';}}
    h+='</tr>';});
  return h+'</tbody></table></div>';}
function tableRO(c){const T=m3Truth(c);const rows=c.f.length>1?T.factors.concat([T.fin]):[T.fin];
  const labs=c.f.length>1?[affHTML(...c.f[0]),affHTML(...c.f[1]),'E(x)']:['E(x) = '+affHTML(...c.f[0])];return tableHTML(T.vals,rows,labs,false);}
function consCorrection(c,u){
  if(S.manche===1)return '<p>Courbe de la carte (trait plein) '+(u.ok?'':'et ta proposition (pointillés)')+' : f(x) = '+exprHTML(c.p)+'</p>'+m1Graph(c.p,u.ok?null:(u.p.base?u.p:null));
  return reveal(c);}

/* ---------- Validation ---------- */
function check(){
  const c=card(S.i),u=U(S.i);let ok=false,msg='';
  if(S.manche===1){const p=u.p;
    if(!p.base){u.msg='Choisis d’abord une brique « fonction ».';u.mk='info';return render();}
    const r=sameFunction(c.p,p);ok=r==='ok';
    if(!ok)msg=p.base!==c.p.base?'Ce n’est pas la bonne famille de courbe. Demande au chef où la courbe existe et comment elle évolue.':
      (r==='domaine'?'Bonne famille, mais l’ensemble de définition ne colle pas : demande au chef où la courbe commence.':'Bonne famille ! Il reste un réglage : prends un point donné par le chef et vérifie que f(a) = b.');}
  else if(S.manche===2){
    const pr=setProblems(u.pieces||[]);if(pr.length){u.msg=pr.join(' ');u.mk='info';return render();}
    const P=u.empty?[]:(u.pieces||[]);if(!u.empty&&!P.length){u.msg='Ajoute au moins une brique, ou choisis ∅.';u.mk='info';return render();}
    ok=sameSet(P,c.truth,c.x0-1,c.x1+1);
    if(!ok)msg='L’ensemble ne correspond pas. Vérifie les bornes (antécédents), les crochets (inégalité large ou stricte ?) et l’ensemble de définition.';}
  else{
    if(!u.nf||!u.vals.length){u.msg='Choisis le nombre de facteurs et les valeurs de la ligne x.';u.mk='info';return render();}
    if(c.op){const pr=setProblems(u.pieces||[]);if(pr.length){u.msg=pr.join(' ');u.mk='info';return render();}}
    const T=m3Truth(c),vs=u.vals.slice().sort((a,b)=>a-b),errs=[];
    if(u.nf!==c.f.length)errs.push('Le nombre de facteurs ne correspond pas.');
    else if(vs.join()!==T.vals.join())errs.push('Les valeurs de la ligne x ne sont pas les bonnes : chaque facteur s’annule en x = −b/a.');
    else{const fin=u.rows[u.rows.length-1];
      if(c.f.length>1){const fr=u.rows.slice(0,2),tf=T.factors;
        const okF=(rowEq(fr[0],tf[0])&&rowEq(fr[1],tf[1]))||(rowEq(fr[0],tf[1])&&rowEq(fr[1],tf[0]));
        if(!okF)errs.push('Une ligne de facteur est fausse : à droite de son zéro, ax + b a le signe de a.');}
      if(fin.iv.join()!==T.fin.iv.join())errs.push('La dernière ligne a un signe faux : applique la règle des signes.');
      if(fin.cv.join()!==T.fin.cv.join())errs.push(c.kind==='quot'?'Dernière ligne : 0 pour le numérateur, double barre || pour la valeur interdite.':'Dernière ligne : il manque un 0 (ou il y en a un en trop).');}
    if(!errs.length&&c.op){const P=u.empty?[]:(u.pieces||[]);if(!sameSet(P,m3Truthset(c),-9,9))errs.push('Le tableau est juste, mais l’ensemble S ne correspond pas (crochets ? valeur interdite ?).');}
    ok=!errs.length;msg=errs.join(' ');}
  u.tries++;
  if(ok){u.done=true;u.ok=true;const pts=Math.max(1,c.L+1-(u.tries-1));u.msg='Bravo ! '+brick(c.L,pts,'+'+pts+' tenon'+(pts>1?'s':''));u.mk='good';
    if(S.mode==='1'||!S.res[S.i])S.res[S.i]={i:S.i,pts,st:'ok'+u.tries};}
  else if(u.tries>=2){u.done=true;u.msg='Pas cette fois. Regardez la correction ensemble : où l’information a-t-elle manqué ?';u.mk='bad';if(S.mode==='1'||!S.res[S.i])S.res[S.i]={i:S.i,pts:0,st:'ko'};}
  else{u.msg=msg+' Il te reste un essai.';u.mk='bad';}
  save();render();}

   +'<h3>Carte d’identité des fonctions de référence</h3>'+refCards()

function refCards(){const R=[['x','Affine f(x) = ax + b','ℝ','droite'],['sq','Carré x²','ℝ','(0;0) (1;1) (−1;1) (2;4)'],['cube','Cube x³','ℝ','(0;0) (1;1) (−1;−1) (2;8)'],['sqrt','Racine √x','[0 ; +∞[','(0;0) (1;1) (4;2)'],['inv','Inverse 1/x','ℝ*','(1;1) (−1;−1) (2;0,5)']];
  return '<div class="mini">'+R.map(r=>{const p=r[0]==='x'?{a:1,base:'lin',h:0,k:1}:{a:1,base:r[0],h:0,k:0};

function memo(){
  if(S.manche===1)return refCards()+'<h3>Stratégies</h3><ul><li>Un point (a ; b) est sur Cf si et seulement si f(a) = b : teste chaque point annoncé.</li><li>Où commence la courbe ? Pas de point pour x < 0 → racine. Pas de point en x = 0 → inverse.</li><li>Observations (niveaux bleu et rouge) : « + k » monte la courbe de k ; un coefficient négatif la retourne ; remplacer x par x − 1 la décale de 1 vers la droite.</li></ul>';

  return '<ul><li>ax + b s’annule en x = −b/a.</li><li>Ligne d’un facteur : signe de −a à gauche du zéro, signe de a à droite.</li><li>Règle des signes : deux signes identiques → +, différents → −.</li><li>Quotient : la valeur qui annule le dénominateur est interdite → double barre || dans la dernière ligne, et toujours exclue de S.</li><li>Crochet toujours ouvert en −∞ et +∞.</li></ul>'+tableHTML([2],[{iv:['−','+'],cv:['0']}],['2x − 4 (a = 2 > 0)'],false);}

   case 'man':keepCode();S.manche=+b.dataset.m;break;case 'mode':keepCode();S.mode=v;break;case 'start':keepCode();S.start=v;break;
   case 'play':startGame();return;
   case 'peek':S.peek=!S.peek;break;
   case 'prev':if(S.i>0)S.i--;S.peek=false;save();break;
   case 'next':if(!(S.res[S.i]||u.done)){if(!S.passing){S.passing=true;break;}S.res[S.i]={i:S.i,pts:0,st:'pass'};}
     S.passing=false;S.i++;S.peek=false;save();render();scrollTo(0,0);return;
   case 'cres':{const c=card(S.i),pts=v==='ok1'?c.L+1:v==='ok2'?Math.max(1,c.L):0;S.res[S.i]={i:S.i,pts,st:v};save();break;}
   case 'check':check();return;
   case 'addInt':u.empty=false;u.pieces.push({t:'int',lb:'[',a:null,b:null,rb:']'});break;
   case 'addPt':u.empty=false;u.pieces.push({t:'pt',a:null});break;
   case 'empty':u.empty=!u.empty;if(u.empty)u.pieces=[];break;
   case 'del':u.pieces.splice(+b.dataset.j,1);break;
   case 'nf':u.nf=+b.dataset.n;u.rows=null;break;
   case 'val':{const n=+v,ix=u.vals.indexOf(n);if(ix>=0)u.vals.splice(ix,1);else u.vals.push(n);u.rows=null;break;}
   case 'cell':{const r=u.rows[+b.dataset.r],j=+b.dataset.c;
     if(b.dataset.t==='iv'){const cyc={'?':'+','+':MINUS,[MINUS]:'+'};r.iv[j]=cyc[r.iv[j]];}
     else{const cyc={'':'0','0':'||','||':''};r.cv[j]=cyc[r.cv[j]];}break;}
   case 'clk':if(v==='go')S.clock.run=!S.clock.run;else{S.clock={left:+v*60,run:false};}setClock();break;
   case 'ptab':S.ptab=v;break;
  }
  if(S.view==='game')save();render();});
document.addEventListener('change',e=>{const t=e.target;if(S.view!=='game')return;const u=U(S.i);
  if(t.dataset.m1){const f=t.dataset.m1;u.p[f]=f==='base'?t.value:Number(t.value);save();render();}
  if(t.dataset.pc!==undefined){const p=u.pieces[+t.dataset.pc],f=t.dataset.fd;p[f]=(f==='lb'||f==='rb')?t.value:parseV(t.value);save();render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;renderModal();}});
render();

}</script></body></html>
