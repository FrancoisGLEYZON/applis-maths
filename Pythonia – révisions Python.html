<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pythonia – révisions Python</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script>
window.MathJax = { tex: { inlineMath: [['$', '$']] }, svg: { fontCache: 'global' }, options: { skipHtmlTags: ['pre', 'code', 'textarea', 'script', 'style'] }, startup: { typeset: false } };
</script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js"></script>
<style>
/* VOICE  : aventure nocturne, chaleureuse, jamais punitive — un jeu d'archipel pour réviser.
   IDEA   : une carte d'archipel à rallumer ; chaque bonne réponse rallume des lucioles.
   PICTURE: îles dessinées en SVG sur une mer de nuit, lucioles, gardiens-boss.
   COLOUR : mer de nuit #0c2a33 dominante, sable #f6ecd2, luciole #d8ff5e ; une couleur par île.
   TYPE   : Baloo 2 (titres), Atkinson Hyperlegible (lisible, pensé pour les élèves dys), JetBrains Mono (code). */
:root{--sea:#0c2a33;--sea2:#123844;--sea3:#1b4a57;--ink:#f6f1e3;--mute:#a9c3c6;--sand:#f6ecd2;--glow:#d8ff5e;--bad:#ff6b6b;--ok:#5ee6a0;--warn:#ffb84d;--card:#fbf7ec;--cink:#1d2a2e;--isl:#ff8a5b;--isld:#b84a2a;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{font-size:17px}html.big{font-size:20px}
body{margin:0;background:var(--sea);color:var(--ink);font:1rem/1.5 'Atkinson Hyperlegible',system-ui,sans-serif;overflow-x:clip;min-height:100vh;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;line-height:1.05;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
code,pre,.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.screen{display:none;min-height:100vh}.screen.on{display:block}
.wrap{max-width:1000px;margin:0 auto;padding:16px max(3vw,14px) 40px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border-radius:14px;font-weight:700;background:var(--glow);color:#1b2a10;box-shadow:0 4px 0 #8fae2a;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8fae2a}
.btn.ghost{background:var(--sea3);color:var(--ink);box-shadow:0 4px 0 #0a2027}
.btn.isl{background:var(--isl);color:#1d1208;box-shadow:0 4px 0 var(--isld)}
.btn[disabled]{opacity:.45;pointer-events:none}
.icon{width:22px;height:22px;flex:none}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px max(3vw,14px);background:#0a232b;position:sticky;top:0;z-index:5}
.top .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--sea2);font-weight:700;font-size:.9rem;white-space:nowrap}
.chip.xp{color:var(--glow)}
.ib{width:44px;height:44px;border-radius:12px;background:var(--sea2);display:inline-grid;place-items:center;font-weight:800}
/* Accueil */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center;min-height:100vh;padding:24px max(4vw,16px)}
.hero h1{font-size:clamp(44px,8vw,84px);color:var(--sand)}
.hero h1 span{color:var(--glow)}
.hero p{font-size:1.1rem;color:var(--mute);max-width:36em}
.namebox{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.namebox input{flex:1 1 220px;min-height:52px;border-radius:14px;border:2px solid var(--sea3);background:var(--sea2);color:var(--ink);font:inherit;font-size:1.1rem;padding:0 16px}
.heroart svg{width:100%;height:auto;max-height:70vh}
@media(max-width:720px){.hero{grid-template-columns:1fr;min-height:0}.heroart{order:-1}.heroart svg{max-height:38vh}}
/* Carte */
.mapgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:14px}
.islcard{position:relative;text-align:left;border-radius:24px;padding:14px 16px 16px;background:radial-gradient(120% 90% at 50% 20%,var(--sea3),var(--sea2));border:2px solid #24545f;display:flex;flex-direction:column;gap:6px}
.islcard svg.art{width:100%;height:150px}
.islcard h2{font-size:1.6rem;color:var(--c)}
.islcard .sub{color:var(--mute);font-size:.92rem}
.bar{height:14px;border-radius:999px;background:#0a2027;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--c,var(--glow));border-radius:999px;transition:width .6s}
.barlab{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mute)}
.finalcard{grid-column:1/-1;--c:#b9a8ff}
.locked{opacity:.55}
.lockmsg{font-size:.9rem;color:var(--warn);font-weight:700}
@media(max-width:600px){.mapgrid{grid-template-columns:1fr}}
.intro{display:flex;gap:14px;align-items:center;background:var(--sea2);border-radius:18px;padding:12px 16px}
.intro svg{width:64px;height:64px;flex:none}
/* Île */
.islhead{border-radius:26px;padding:18px;background:linear-gradient(180deg,var(--isl),var(--isld));color:#1d1208;display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:12px;align-items:center}
.islhead h1{font-size:clamp(32px,5vw,48px)}
.islhead .bar{background:rgba(0,0,0,.25)}.islhead .bar>i{background:#fff8e0}
.islhead svg{width:100%;height:140px}
@media(max-width:560px){.islhead{grid-template-columns:1fr}.islhead svg{height:110px}}
.blocks{display:grid;gap:12px;margin-top:16px}
.blk{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;background:var(--sea2);border-radius:18px;padding:12px 14px;border:2px solid transparent}
.blk:hover{border-color:var(--isl)}
.blk .num{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font:800 1.4rem 'Baloo 2';background:var(--isl);color:#1d1208}
.blk h3{font-size:1.25rem}
.blk .meta{font-size:.85rem;color:var(--mute)}
.gauge{margin-top:6px}
.gauge .bar{height:10px}
.gl{font-size:.8rem;font-weight:700}
.tag{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;background:#0a2027;color:var(--mute)}
.bossblk{background:linear-gradient(90deg,#2a1830,var(--sea2));border-color:#5a2f52}
.bossblk .num{background:#2a1830;padding:2px}.bossblk .num svg{width:48px;height:48px}
/* Jeu */
.gtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gtop .ttl{flex:1;font:800 1.15rem 'Baloo 2';color:var(--isl)}
.lives{display:flex;gap:4px}
.lives svg{width:30px;height:30px}
.lives .lost{opacity:.18;filter:grayscale(1)}
.dots{display:flex;gap:6px;margin:12px 0}
.dots i{flex:1;height:8px;border-radius:9px;background:var(--sea3)}
.dots i.done{background:var(--isl)}.dots i.half{background:var(--warn)}.dots i.miss{background:var(--bad)}.dots i.cur{background:var(--ink)}
.qcard{background:var(--card);color:var(--cink);border-radius:22px;padding:18px clamp(14px,3vw,26px) 22px;box-shadow:0 10px 0 rgba(0,0,0,.18)}
.qprompt{font-size:1.15rem;margin:0 0 12px;display:flex;gap:10px;align-items:flex-start}
.qprompt .t{flex:1}
.qprompt code,.mth code,.fb code{background:#ece3cb;padding:1px 6px;border-radius:6px;font-size:.92em;color:#3a2a10}
pre.py{background:#18262b;color:#e9f1ea;border-radius:14px;padding:12px 16px;font-size:1rem;line-height:1.55;overflow-x:auto;margin:10px 0;white-space:pre}
.k{color:#ff9a6b;font-weight:700}.s{color:#c9f27a}.n{color:#7fd8ff}.c{color:#7f9a9a;font-style:italic}.b{color:#f7d06b}
.choices{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.choice{min-height:56px;padding:10px 14px;border-radius:14px;background:#efe6cd;color:var(--cink);text-align:left;border:3px solid transparent;font-size:1.05rem}
.choice.code{font-family:'JetBrains Mono',monospace;white-space:pre;font-size:.95rem;overflow-x:auto}
.choice.sel{border-color:#2b7a8a;background:#dff1ef}
.choice.right{border-color:#1f9d63;background:#d6f5e4}.choice.wrong{border-color:var(--bad);background:#ffe1dc}
.ans{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ans input{min-height:56px;border-radius:14px;border:3px solid #d9cfb2;background:#fff;font:inherit;font-size:1.3rem;padding:0 14px;color:var(--cink);flex:1 1 200px;max-width:420px}
.ans input.wrong{border-color:var(--bad)}.ans input.right{border-color:#1f9d63}
.small{font-size:.88rem;color:#5f6b66}
table.trace{border-collapse:separate;border-spacing:0;width:100%;max-width:560px;font-size:1.05rem}
table.trace th{background:#18262b;color:#fff;padding:8px;font-family:'JetBrains Mono',monospace;font-weight:700}
table.trace th:first-child{border-radius:12px 0 0 0}table.trace th:last-child{border-radius:0 12px 0 0}
table.trace td{padding:5px 8px;border-bottom:1px solid #e3d9bd;text-align:center;font-family:'JetBrains Mono',monospace}
table.trace td input{width:100%;max-width:130px;min-height:46px;text-align:center;border-radius:10px;border:3px solid #d9cfb2;font:inherit;font-size:1.1rem}
table.trace input:disabled,.ans input:disabled{opacity:1;color:var(--cink);-webkit-text-fill-color:var(--cink);background:#eef9f2}
table.trace input.wrong{border-color:var(--bad);background:#ffe9e5}table.trace input.right{border-color:#1f9d63}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.pick button{min-height:54px;border-radius:12px;background:#efe6cd;font:700 1.15rem 'JetBrains Mono',monospace;color:var(--cink);border:3px solid transparent}
.pick button.sel{background:#2b7a8a;color:#fff}
.pick button.miss{border-color:#1f9d63;border-style:dashed}.pick button.extra{border-color:var(--bad)}
.fillcode .hole{display:inline-block;min-width:3.2em;min-height:1.6em;padding:0 8px;border-radius:8px;border:2px dashed #7fd8ff;background:#22363d;color:#fff;font:inherit;vertical-align:baseline;line-height:1.5}
.fillcode .hole.act{border-style:solid;border-color:var(--glow);box-shadow:0 0 0 3px rgba(216,255,94,.3)}
.fillcode .hole.wrong{border-color:var(--bad);border-style:solid}.fillcode .hole.right{border-color:var(--ok);border-style:solid}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tile{min-height:48px;padding:6px 14px;border-radius:12px;background:#18262b;color:#f2f2e8;font:700 1rem 'JetBrains Mono',monospace;box-shadow:0 3px 0 #0a1418}
.tile.used{opacity:.35}
.ordz{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.ordz .zone{border-radius:14px;padding:8px;min-height:70px;background:#efe6cd;display:flex;flex-direction:column;gap:6px}
.ordz .zone.prog{background:#18262b}
.ordz .lab{font-size:.85rem;font-weight:700;color:#5f6b66}
.line{text-align:left;min-height:44px;padding:6px 12px;border-radius:10px;background:#fff;color:var(--cink);font:1rem 'JetBrains Mono',monospace;white-space:pre;overflow-x:auto;box-shadow:0 2px 0 #d9cfb2}
.prog .line{background:#22363d;color:#e9f1ea;box-shadow:none}
.prog .ph{color:#7f9a9a;font-size:.9rem;padding:8px}
.editor{display:grid;gap:8px}
.editor textarea{width:100%;min-height:190px;resize:vertical;border-radius:14px;background:#18262b;color:#e9f1ea;border:3px solid #2c444b;padding:12px 14px;font:1.02rem/1.55 'JetBrains Mono',monospace;tab-size:4;caret-color:var(--glow)}
.keybar{display:flex;flex-wrap:wrap;gap:6px}
.keybar button{min-height:44px;min-width:44px;padding:4px 10px;border-radius:10px;background:#e6dcc0;color:var(--cink);font:700 .95rem 'JetBrains Mono',monospace}
.keybar button.w{background:#2b7a8a;color:#fff}
.console{background:#0f1a1d;color:#dfe;border-radius:12px;padding:10px 14px;font:.95rem/1.45 'JetBrains Mono',monospace;white-space:pre-wrap;max-height:220px;overflow:auto}
.console .e{color:#ff9d8f}.console .h{color:#9fb3b3}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.fb{margin-top:14px;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start}
.fb svg{width:54px;height:54px;flex:none}
.fb.ok{background:#d6f5e4}.fb.hint{background:#fff1cf}.fb.ko{background:#ffe1dc}
.fb h3{font-size:1.25rem;margin-bottom:4px}
.hintbtn{background:#2b7a8a;color:#fff;box-shadow:0 4px 0 #1a4e58}
.say{width:40px;height:40px;border-radius:10px;background:#e6dcc0;display:grid;place-items:center;flex:none}
/* Boss */
.bossarena{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center;background:linear-gradient(180deg,#2a1830,#123844);border-radius:20px;padding:10px 14px;margin:10px 0}
.bossarena svg{width:150px;height:130px}
.bossarena .hp{height:16px}.bossarena .hp>i{background:linear-gradient(90deg,#ff6b6b,#ffb84d)}
.bossarena .say2{font-style:italic;color:var(--sand)}
.hit{animation:hit .5s}
@keyframes hit{0%,100%{transform:none}25%{transform:translateX(-10px) rotate(-4deg)}60%{transform:translateX(8px) rotate(3deg);filter:brightness(2)}}
@media(max-width:560px){.bossarena{grid-template-columns:90px minmax(0,1fr)}.bossarena svg{width:90px;height:80px}}
/* Modales */
.modal{position:fixed;inset:0;background:rgba(4,16,20,.72);display:none;place-items:center;z-index:20;padding:14px}
.modal.on{display:grid}
.mbox{background:var(--card);color:var(--cink);border-radius:24px;max-width:720px;width:100%;max-height:92vh;overflow:auto;padding:20px clamp(16px,3vw,28px)}
.mbox h2{font-size:1.8rem;color:var(--isld)}
.mth{font-size:1.05rem}.mth ol,.mth ul{padding-left:1.3em}.mth li{margin:4px 0}
table.mt{border-collapse:collapse;margin:8px 0}table.mt td{padding:6px 10px;border-bottom:1px solid #e3d9bd}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--isl);color:#1d1208;font-weight:700;font-size:.85rem}
.res{text-align:center}
.res svg{width:140px;height:140px}
.res h1{font-size:clamp(34px,6vw,52px);color:var(--sand);margin:6px 0}
.bigpct{font:800 3rem 'Baloo 2';color:var(--glow)}
.carnet .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #24545f}
.carnet h2{margin:20px 0 6px;color:var(--c)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--mute)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px}
.flies circle{animation:fly 4s ease-in-out infinite alternate}
@keyframes fly{to{transform:translate(6px,-8px);opacity:.5}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<!-- ACCUEIL -->
<section class="screen on" id="s-home">
  <div class="hero">
    <div>
      <h1>Pytho<span>nia</span></h1>
      <h2 style="font-size:1.6rem;color:var(--glow);margin:6px 0 14px">L'archipel des lucioles</h2>
      <p>La Brume a éteint les lucioles de l'archipel. Pour les rallumer, il faut parler leur langue : <b style="color:var(--ink)">Python</b>. Explore les quatre îles, réussis les épreuves, affronte leurs gardiens… puis la Reine de la Brume.</p>
      <div class="namebox"><input id="pname" maxlength="24" placeholder="Ton prénom d'explorateur·rice" autocomplete="off"><button class="btn" id="go">Partir à l'aventure</button></div>
      <p class="small" style="color:var(--mute);margin-top:14px">Ta progression est gardée sur cette tablette.</p>
    </div>
    <div class="heroart" id="heroart"></div>
  </div>
</section>
<!-- CARTE -->
<section class="screen" id="s-map">
  <div class="top"><b style="font:800 1.3rem 'Baloo 2';color:var(--sand)">Pytho<span style="color:var(--glow)">nia</span></b><span class="grow"></span><span class="chip" id="m-rank"></span><span class="chip xp" id="m-xp"></span><button class="btn ghost" id="b-carnet" style="min-height:44px;padding:6px 14px">Mon carnet</button><button class="ib" id="b-big" aria-label="Agrandir le texte">A+</button></div>
  <div class="wrap">
    <div class="intro" id="m-intro"></div>
    <div class="mapgrid" id="mapgrid"></div>
  </div>
</section>
<!-- ÎLE -->
<section class="screen" id="s-island">
  <div class="top"><button class="btn ghost" id="b-back-map" style="min-height:44px;padding:6px 14px">← Carte</button><span class="grow"></span><span class="chip xp" id="i-xp"></span></div>
  <div class="wrap" id="islwrap"></div>
</section>
<!-- JEU -->
<section class="screen" id="s-game">
  <div class="wrap" style="max-width:900px">
    <div class="gtop"><button class="ib" id="b-quit" aria-label="Quitter le niveau">✕</button><span class="ttl" id="g-title"></span><button class="btn hintbtn" id="b-help" style="min-height:44px;padding:6px 16px">Aide</button><div class="lives" id="g-lives"></div></div>
    <div id="g-boss"></div>
    <div class="dots" id="g-dots"></div>
    <div class="qcard" id="g-card"></div>
  </div>
</section>
<!-- RÉSULTAT -->
<section class="screen" id="s-res"><div class="wrap res" id="reswrap" style="max-width:640px;padding-top:40px"></div></section>
<!-- CARNET -->
<section class="screen" id="s-carnet">
  <div class="top"><button class="btn ghost" id="b-back-map2" style="min-height:44px;padding:6px 14px">← Carte</button><span class="grow"></span><span class="chip xp" id="c-xp"></span></div>
  <div class="wrap carnet" id="carwrap"></div>
</section>
<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<script>
// ===== Mini-interpréteur Python (sous-ensemble du programme de 2nde) =====
const PY = (() => {
  class PyErr extends Error { constructor(msg, line) { super(msg); this.line = line; } }
  class F { constructor(v) { this.v = v; } }            // flottant
  const isF = x => x instanceof F;
  const num = x => isF(x) ? x.v : (x === true ? 1 : x === false ? 0 : x);
  const isNum = x => typeof x === 'number' || isF(x) || typeof x === 'boolean';
  const KW = new Set(['def','return','if','elif','else','for','in','while','and','or','not','True','False','None','pass','break','continue','range']);

  // ---------- Lexer ----------
  function lex(src) {
    const lines = src.replace(/\t/g, '    ').replace(/\r/g, '').split('\n');
    const toks = []; const indents = [0]; let depth = 0;
    lines.forEach((raw, i) => {
      const ln = i + 1;
      let line = raw;
      if (depth === 0) {
        if (/^\s*(#.*)?$/.test(line)) return;
        const ind = line.match(/^ */)[0].length;
        if (ind > indents[indents.length - 1]) { indents.push(ind); toks.push({ t: 'INDENT', ln }); }
        else {
          while (ind < indents[indents.length - 1]) { indents.pop(); toks.push({ t: 'DEDENT', ln }); }
          if (ind !== indents[indents.length - 1]) throw new PyErr("Problème d'indentation (décalage) : les lignes d'un même bloc doivent être alignées.", ln);
        }
      }
      let p = 0;
      while (p < line.length) {
        const c = line[p];
        if (c === ' ') { p++; continue; }
        if (c === '#') break;
        let m;
        if ((m = line.slice(p).match(/^(\d+\.\d*|\.\d+|\d+)([eE][-+]?\d+)?/))) {
          const s = m[0];
          if (/[A-Za-z_(]/.test(line[p + s.length] || '')) throw new PyErr('Il manque le signe * : en Python on écrit ' + s + '*' + (line[p + s.length] === '(' ? '(...)' : line[p + s.length]) + ' (la multiplication doit être écrite).', ln);
          toks.push({ t: 'NUM', v: /[.eE]/.test(s) ? new F(parseFloat(s)) : parseInt(s, 10), ln }); p += s.length; continue;
        }
        if ((m = line.slice(p).match(/^[A-Za-z_À-ÿ][A-Za-z_0-9À-ÿ]*/))) {
          const s = m[0]; toks.push({ t: KW.has(s) && s !== 'range' ? s : 'NAME', v: s, ln }); p += s.length; continue;
        }
        if (c === '"' || c === "'") {
          let j = p + 1, s = '';
          while (j < line.length && line[j] !== c) { if (line[j] === '\\' && j + 1 < line.length) { j++; s += line[j] === 'n' ? '\n' : line[j]; } else s += line[j]; j++; }
          if (j >= line.length) throw new PyErr('Guillemet non fermé : il manque un ' + c + ' à la fin du texte.', ln);
          toks.push({ t: 'STR', v: s, ln }); p = j + 1; continue;
        }

const KEYS = ['⇥', '⇤', ':', '(', ')', '=', '==', '<', '>', '<=', '>=', '!=', '+', '-', '*', '/', '**', '%', '"', 'print(', 'range(', 'for ', ' in ', 'while ', 'if ', 'else:', 'def ', 'return ', 'and', 'or'];

W.code = {
  render(q, el) {

    const ed = $('#ed');
    const ins = (txt) => { const s = ed.selectionStart, e = ed.selectionEnd; ed.setRangeText(txt, s, e, 'end'); ed.focus(); q._.draft = ed.value; };
    ed.addEventListener('keydown', e => {

  ${ISLANDS.map(i => `<h2 style="--c:${i.color}">${esc(i.name)} ${S.bosses[i.id] ? '<span class="tag" style="color:var(--glow)">gardien vaincu</span>' : ''}</h2>${i.blocks.map(b => `<div class="row"><div><b>${esc(b.name)}</b><br><span class="small" style="color:var(--mute)">${b.skill}</span></div>${gaugeHTML(blkState(i, b).best, blkState(i, b).plays)}</div>`).join('')}`).join('')}
  <h2 style="--c:var(--glow)">Mon bilan pour le professeur</h2><p style="color:var(--mute)">Copie ce bilan pour le coller dans l'ENT ou un message.</p><pre class="console" id="bilan"></pre><div class="actions" style="justify-content:flex-start"><button class="btn" id="b-copy">Copier mon bilan</button></div>
  <details style="margin-top:30px;color:var(--mute)"><summary>Espace professeur</summary><p>Déverrouiller tous les gardiens (pour une démonstration) ou effacer la progression de cette tablette.</p><div class="actions" style="justify-content:flex-start"><button class="btn ghost" id="b-unl">${S.unlock ? 'Reverrouiller' : 'Tout déverrouiller'}</button><button class="btn ghost" id="b-reset">Effacer la progression</button></div></details>`;
  const bil = `Pythonia – ${S.name} – ${S.xp} lucioles (${rank()})\n` + ISLANDS.map(i => `${i.name}${S.bosses[i.id] ? ' [gardien vaincu]' : ''}\n` + i.blocks.map(b => { const p = blkState(i, b).best; return `  - ${b.name} : ${Math.round(p * 100)} % (${level(p, blkState(i, b).plays)[0]})`; }).join('\n')).join('\n') + (S.bosses.final ? '\nBoss final vaincu !' : '');
  $('#bilan').textContent = bil;
  $('#b-copy').onclick = () => { try { navigator.clipboard.writeText(bil).then(() => $('#b-copy').textContent = 'Copié !', () => $('#b-copy').textContent = 'Sélectionne le texte et copie-le'); } catch (e) { $('#b-copy').textContent = 'Sélectionne le texte et copie-le'; } };
  $('#b-unl').onclick = () => { S.unlock = !S.unlock; save(); renderCarnet(); };
  $('#b-reset').onclick = () => { $('#mbox').innerHTML = `<h2>Tout effacer ?</h2><p>Les jauges, lucioles et gardiens de cette tablette seront remis à zéro. C'est définitif.</p><div class="actions"><button class="btn ghost" id="m-x">Annuler</button><button class="btn isl" id="m-r" style="background:var(--bad)">Effacer</button></div>`; $('#modal').classList.add('on'); $('#m-x').onclick = closeModal; $('#m-r').onclick = () => { const n = S.name; S = { name: n, xp: 0, blocks: {}, bosses: {}, unlock: false, big: S.big }; save(); closeModal(); renderCarnet(); }; };
  show('s-carnet');
}

// ================= Démarrage =================
$('#heroart').innerHTML = heroSVG();
$('#pname').value = S.name || '';
const goMap = () => { const n = $('#pname').value.trim(); if (!n) { $('#pname').focus(); $('#pname').placeholder = 'Écris ton prénom pour commencer'; return; } S.name = n; save(); renderMap(); show('s-map'); };
$('#go').onclick = goMap; $('#pname').onkeydown = e => { if (e.key === 'Enter') goMap(); };
$('#b-carnet').onclick = renderCarnet;
$('#b-back-map').onclick = $('#b-back-map2').onclick = () => { renderMap(); show('s-map'); };
const applyBig = () => document.documentElement.classList.toggle('big', !!S.big);
$('#b-big').onclick = () => { S.big = !S.big; save(); applyBig(); }; applyBig();
if (S.name) $('#go').textContent = 'Reprendre l\'aventure';
}

</script>
</body>
</html>
