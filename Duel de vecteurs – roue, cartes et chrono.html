<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duel de vecteurs</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5f1;--card:#fff;--text:#1c1c1a;--muted:#6b6a65;--line:#dcdad2;--btn:#1c1c1a;--btnt:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#161614;--card:#222220;--text:#f1f0ea;--muted:#a3a29a;--line:#3a3935;--btn:#f1f0ea;--btnt:#161614}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#161614;--card:#222220;--text:#f1f0ea;--muted:#a3a29a;--line:#3a3935;--btn:#f1f0ea;--btnt:#161614}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;min-height:100vh}
main{max-width:1100px;margin:0 auto;padding:16px;display:grid;grid-template-columns:3fr 2fr;gap:16px}
@media (max-width:760px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center}
h2{margin:0 0 4px;font-size:15px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.round{font-size:40px;font-weight:700;margin:4px 0}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:28px;margin-bottom:6px}
.chip{width:28px;height:28px;border-radius:50%;border:2px solid var(--line)}
.wheelbox{position:relative;width:min(100%,360px);aspect-ratio:1;margin:8px auto}
.wheelbox svg{width:100%;height:100%;display:block;transform-origin:50% 50%}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--text);z-index:2}
button{font:inherit;font-size:20px;font-weight:600;padding:14px 28px;border:0;border-radius:14px;background:var(--btn);color:var(--btnt);cursor:pointer;touch-action:manipulation;margin:4px}
button.alt{background:transparent;color:var(--text);border:2px solid var(--line)}
button:disabled{opacity:.3}
.time{font-size:80px;font-weight:700;font-variant-numeric:tabular-nums;margin:6px 0}
.time.end{color:#d8352a;animation:blink .6s infinite}
@keyframes blink{50%{opacity:.25}}
.hidden{display:none!important}
.scene{perspective:1200px;width:min(100%,640px);margin:8px auto;min-height:340px;cursor:pointer}
.inner{display:grid;position:relative;width:100%;min-height:340px;transition:transform .6s;transform-style:preserve-3d}
.inner.flip{transform:rotateY(180deg)}
.face{position:relative;grid-area:1/1;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.back{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);border:6px solid rgba(255,255,255,.7)}
.back img{max-width:70%;max-height:55%;object-fit:contain}
.back .emoji{font-size:90px}
.back .vn{font-size:30px;font-weight:800;margin-top:8px}
.back .hint{margin-top:12px;font-size:16px;opacity:.9}
.front{background:#fffdf7;color:#1c1c1a;transform:rotateY(180deg);border:8px solid var(--c,#999);font-size:21px;line-height:1.45;white-space:pre-line}
.front .tag{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--c,#999);padding:3px 12px;border-radius:99px;margin-bottom:12px}
.front.ans{background:#eefaf1}
.vec{position:relative;display:inline-block}
.vec::before{content:"→";position:absolute;left:-.05em;right:-.05em;top:-.78em;text-align:center;font-size:.8em;line-height:1;font-weight:400}
.front{line-height:1.9}
.back img{filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
.starbadge{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#fff3a8;color:#6a4a00;font-weight:800;font-size:15px;padding:4px 14px;border-radius:99px;text-shadow:none;white-space:nowrap}
.spark{position:absolute;color:#fff7b0;text-shadow:0 0 8px #fff,0 0 14px #ffd54a;animation:tw 1.6s infinite;pointer-events:none}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(90deg)}}
.starcard{animation:glow 1.5s infinite}
@keyframes glow{50%{box-shadow:0 0 30px 10px rgba(255,235,120,.9)}}
.front small{font-size:15px;color:#666;margin-top:14px}
.front mjx-container{max-width:100%}
.front svg:not(mjx-container svg){display:block}
</style>
</head>
<body>
<main>
  <section class="panel">
    <h2>Manche</h2>
    <div class="round" id="round"></div>
    <div class="chips" id="chips"></div>

    <div id="wheelView">
      <div class="wheelbox"><div class="pointer"></div><div id="rotor" style="width:100%;height:100%"><svg id="svg" viewBox="-100 -100 200 200"><g id="wg"></g></svg></div></div>
      <button id="spin">Lancer la roue</button>
      <button class="alt" id="newgame">Nouvelle partie</button>
    </div>

    <div id="cardView" class="hidden">
      <div class="scene" id="scene"><div class="inner" id="inner">
        <div class="face back" id="back"></div>
        <div class="face front" id="front"></div>
      </div></div>
    </div>
  </section>

  <section class="panel">
    <h2>Chrono</h2>
    <div class="time" id="time">3:00</div>
    <button id="start" disabled>Lancer le chrono</button>
    <button id="early" class="alt" disabled>On a fini plus tôt</button>
    <button class="alt" id="reset">Remettre le chrono</button>
    <p style="color:var(--muted);margin-top:16px" id="help"></p>
  </section>
</main>

  {q:R`On pose $\vec{a}=2\vec{i}$ et $\vec{b}=2\vec{j}$.¶Le vecteur $\vec{v}\col{3}{-1}$ dans la base $(\vec{a},\vec{b})$.¶Donner ses coordonnées dans la base $(\vec{i},\vec{j})$.`,
   a:R`$\vec{v}=3\vec{a}-\vec{b}$, avec $\vec{a}=2\vec{i}$ et $\vec{b}=2\vec{j}$.¶$\vec{v}=3\times 2\vec{i}-2\vec{j}=6\vec{i}-2\vec{j}$¶Coordonnées : $\vec{v}\col{6}{-2}$`},
  {star:true,time:240,q:R`On pose $\vec{a}=2\vec{i}+\vec{j}$ et $\vec{b}=\vec{i}-\vec{j}$.¶Le vecteur $\vec{u}=7\vec{i}-\vec{j}$.¶Donner ses coordonnées $(x\,;\,y)$ dans la base $(\vec{a},\vec{b})$.`,
   a:R`On cherche $x$ et $y$ tels que $\vec{u}=x\vec{a}+y\vec{b}$.¶$x\vec{a}+y\vec{b}=(2x+y)\vec{i}+(x-y)\vec{j}$, donc $2x+y=7$ et $x-y=-1$.¶En additionnant : $3x=6$, donc $x=2$, puis $y=x+1=3$.¶Coordonnées : $\vec{u}\col{2}{3}$`}
 ],
 violet:[
  {q:R`$A\pt{1}{2}$, $B\pt{-2}{5}$ et $C\pt{-3}{-3}$.¶Calculer les coordonnées de $\vc{AB}$ et $\vc{CA}$.`,
   a:R`On calcule « arrivée − départ » : $\vc{AB}\col{x_B-x_A}{y_B-y_A}$.¶$\vc{AB}=\col{-2-1}{5-2}=\col{-3}{3}$¶$\vc{CA}=\col{1-(-3)}{2-(-3)}=\col{4}{5}$`},
  {q:R`$D\pt{3}{-2}$, $E\pt{-1}{-4}$ et $F\pt{-3}{2}$.¶Calculer les coordonnées de $\vc{DE}$ et $\vc{EF}$.`,
   a:R`On calcule « arrivée − départ ».¶$\vc{DE}=\col{-1-3}{-4-(-2)}=\col{-4}{-2}$¶$\vc{EF}=\col{-3-(-1)}{2-(-4)}=\col{-2}{6}$`},
  {star:true,time:240,q:R`$A\pt{-2}{3}$, $B\pt{4}{-1}$ et $C\pt{5}{3}$.¶a) Trouver $D$ tel que $ABDC$ soit un parallélogramme.¶b) Trouver $E$ tel que $\vc{AE}=\vc{AD}+\vc{CB}$.`,
   a:R`a) $ABDC$ est un parallélogramme si et seulement si $\vc{AB}=\vc{CD}$.¶$\vc{AB}=\col{4-(-2)}{-1-3}=\col{6}{-4}$ et $\vc{CD}=\col{x_D-5}{y_D-3}$.¶Donc $x_D-5=6$ et $y_D-3=-4$, d’où $D\pt{11}{-1}$.¶b) $\vc{AD}=\col{13}{-4}$ et $\vc{CB}=\col{4-5}{-1-3}=\col{-1}{-4}$.¶$\vc{AE}=\vc{AD}+\vc{CB}=\col{12}{-8}$¶Donc $x_E+2=12$ et $y_E-3=-8$, d’où $E\pt{10}{-5}$.`}
 ],
 bleu:[
  {q:R`$\vec{u}\col{-5}{6}$ et $\vec{v}\col{3}{7}$.¶Calculer les coordonnées de $\vec{u}-\vec{v}$ et de $-3\vec{u}$.`,
   a:R`$\vec{u}-\vec{v}=\col{-5-3}{6-7}=\col{-8}{-1}$¶$-3\vec{u}=\col{-3\times(-5)}{-3\times 6}=\col{15}{-18}$`},
  {q:R`$\vec{u}\col{7}{0}$, $\vec{v}\col{-5}{3}$ et $\vec{w}\col{1}{-3}$.¶Calculer les coordonnées de $-2\vec{v}$ et de $3\vec{w}-2\vec{u}$.`,
   a:R`$-2\vec{v}=\col{-2\times(-5)}{-2\times 3}=\col{10}{-6}$¶$3\vec{w}-2\vec{u}=\col{3\times 1-2\times 7}{3\times(-3)-2\times 0}=\col{-11}{-9}$`},
  {q:R`$\vec{u}\col{-5}{6}$, $\vec{v}\col{3}{7}$ et $\vec{w}\col{5}{-11}$.¶Calculer les coordonnées de $\vec{u}+\vec{v}-\vec{w}$ et de $3\vec{v}+2\vec{u}$.`,
   a:R`$\vec{u}+\vec{v}-\vec{w}=\col{-5+3-5}{6+7-(-11)}=\col{-7}{24}$¶$3\vec{v}+2\vec{u}=\col{3\times 3+2\times(-5)}{3\times 7+2\times 6}=\col{-1}{33}$`},
  {star:true,time:240,q:R`$\vec{u}\col{2}{-1}$ et $\vec{v}\col{-2}{3}$.¶Trouver les coordonnées du vecteur $\vec{w}$ tel que $\vec{u}+2\vec{w}=3\vec{v}$.`,
   a:R`On isole $\vec{w}$ : $2\vec{w}=3\vec{v}-\vec{u}$, donc $\vec{w}=\frac{1}{2}(3\vec{v}-\vec{u})$.¶$3\vec{v}-\vec{u}=\col{-6-2}{9-(-1)}=\col{-8}{10}$¶$\vec{w}=\frac{1}{2}\col{-8}{10}=\col{-4}{5}$`}
 ],
 vert:[
  {q:R`$C\pt{5}{1}$ et $D\pt{-2}{1}$.¶Donner les coordonnées du milieu de $[CD]$.`,
   a:R`Le milieu a pour coordonnées $\left(\frac{x_C+x_D}{2}\,;\,\frac{y_C+y_D}{2}\right)$.¶$\left(\frac{5+(-2)}{2}\,;\,\frac{1+1}{2}\right)=\left(\frac{3}{2}\,;\,1\right)$, soit $(1{,}5\,;\,1)$`},
  {q:R`$A\pt{-4}{3}$ et $B\pt{6}{-7}$.¶Donner les coordonnées du milieu de $[AB]$.`,
   a:R`$\left(\frac{-4+6}{2}\,;\,\frac{3+(-7)}{2}\right)=\left(1\,;\,-2\right)$`},
  {q:R`$M\pt{2}{-5}$ et $N\pt{-3}{8}$.¶Donner les coordonnées du milieu de $[MN]$.`,
   a:R`$\left(\frac{2+(-3)}{2}\,;\,\frac{-5+8}{2}\right)=\left(-\frac{1}{2}\,;\,\frac{3}{2}\right)$, soit $(-0{,}5\,;\,1{,}5)$`},
  {star:true,time:240,q:R`$A\pt{-1}{4}$ et $I\pt{2}{-3}$.¶$I$ est le milieu de $[AB]$. Trouver les coordonnées de $B$.`,
   a:R`$x_I=\frac{x_A+x_B}{2}$ et $y_I=\frac{y_A+y_B}{2}$, donc $x_B=2x_I-x_A$ et $y_B=2y_I-y_A$.¶$x_B=2\times 2-(-1)=5$¶$y_B=2\times(-3)-4=-10$¶Donc $B\pt{5}{-10}$`}
 ],
 orange:[
  {q:R`$\vec{u}\col{3}{-4}$.¶Calculer la norme de $\vec{u}$.`,
   a:R`$\|\vec{u}\|=\sqrt{x^2+y^2}=\sqrt{3^2+(-4)^2}=\sqrt{9+16}=\sqrt{25}=5$`},
  {q:R`$A\pt{1}{-3}$ et $C\pt{3}{3}$.¶Calculer la longueur $AC$ (valeur exacte, forme simplifiée).`,
   a:R`$\vc{AC}=\col{3-1}{3-(-3)}=\col{2}{6}$¶$AC=\sqrt{2^2+6^2}=\sqrt{40}=\sqrt{4\times 10}=2\sqrt{10}$`},
  {q:R`$B\pt{-4}{-1}$ et $D\pt{-1}{2}$.¶Calculer la longueur $BD$ (valeur exacte, forme simplifiée).`,
   a:R`$\vc{BD}=\col{-1-(-4)}{2-(-1)}=\col{3}{3}$¶$BD=\sqrt{3^2+3^2}=\sqrt{18}=\sqrt{9\times 2}=3\sqrt{2}$`},
  {star:true,time:240,q:R`$A\pt{6}{5}$, $B\pt{2}{-3}$ et $C\pt{-4}{0}$.¶Calculer le périmètre du triangle $ABC$ (valeur exacte).`,
   a:R`$AB=\sqrt{(2-6)^2+(-3-5)^2}=\sqrt{80}=4\sqrt{5}$¶$AC=\sqrt{(-4-6)^2+(0-5)^2}=\sqrt{125}=5\sqrt{5}$¶$BC=\sqrt{(-4-2)^2+(0+3)^2}=\sqrt{45}=3\sqrt{5}$¶Périmètre : $4\sqrt{5}+5\sqrt{5}+3\sqrt{5}=12\sqrt{5}$`}
 ],
 gris:[
  {q:R`$A\pt{-2}{-1}$, $B\pt{2}{-3}$, $C\pt{-4}{4}$ et $D\pt{6}{-1}$.¶Les droites $(AB)$ et $(CD)$ sont-elles parallèles ?`,
   a:R`$\vc{AB}\col{4}{-2}$ et $\vc{CD}\col{10}{-5}$.¶$\det(\vc{AB},\vc{CD})=4\times(-5)-10\times(-2)=-20+20=0$¶Les vecteurs sont colinéaires : oui, $(AB)$ et $(CD)$ sont parallèles.`},
  {q:R`$A\pt{1}{2}$, $B\pt{3}{3}$ et $C\pt{7}{5}$.¶Les points $A$, $B$ et $C$ sont-ils alignés ?`,
   a:R`$\vc{AB}\col{2}{1}$ et $\vc{AC}\col{6}{3}$.¶$\det(\vc{AB},\vc{AC})=2\times 3-6\times 1=0$¶Les vecteurs sont colinéaires : oui, $A$, $B$ et $C$ sont alignés.`},
  {q:R`$\vec{u}\col{6}{-4}$ et $\vec{v}\col{-9}{5}$.¶Les vecteurs $\vec{u}$ et $\vec{v}$ sont-ils colinéaires ?`,
   a:R`$\det(\vec{u},\vec{v})=6\times 5-(-9)\times(-4)=30-36=-6$¶$-6\neq 0$ : non, ils ne sont pas colinéaires.`},
  {star:true,time:240,q:R`$A\pt{1}{2}$, $B\pt{4}{3}$ et $C\pt{7}{k}$.¶Pour quelle valeur de $k$ les points $A$, $B$ et $C$ sont-ils alignés ?`,
   a:R`$A$, $B$, $C$ alignés $\iff\det(\vc{AB},\vc{AC})=0$.¶$\vc{AB}\col{3}{1}$ et $\vc{AC}\col{6}{k-2}$.¶$\det(\vc{AB},\vc{AC})=3(k-2)-6\times 1=3k-12$¶$3k-12=0$ donc $k=4$`}
 ]
};

function sb(b,a){return b+'-'+(a<0?'('+a+')':a)}
function figCard(q,f){var a;
  if(f.k==='base')a='On compte les carreaux : horizontalement (vers la droite, +) puis verticalement (vers le haut, +).¶'+f.vecs.map(function(v){return '$\\vec{'+v.n+'}\\col{'+(v.b[0]-v.a[0])+'}{'+(v.b[1]-v.a[1])+'}$'}).join('¶');
  else{var P={};f.pts.forEach(function(p){P[p.n]=p.p});
    a='Lecture : '+f.pts.map(function(p){return '$'+p.n+'\\pt{'+p.p[0]+'}{'+p.p[1]+'}$'}).join(', ')+'¶'+f.ask.map(function(r){var A=P[r[0]],B=P[r[1]];return '$\\vc{'+r[0]+r[1]+'}=\\col{'+sb(B[0],A[0])+'}{'+sb(B[1],A[1])+'}=\\col{'+(B[0]-A[0])+'}{'+(B[1]-A[1])+'}$'}).join('¶')}
  return {fig:f,q:q,a:a}}
function arr(x1,y1,x2,y2,c,w,h){h=h||11;var a=Math.atan2(y2-y1,x2-x1),k=.45;
  return '<line x1="'+x1+'" y1="'+y1+'" x2="'+(x2-h*.6*Math.cos(a))+'" y2="'+(y2-h*.6*Math.sin(a))+'" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round"/><polygon points="'+x2+','+y2+' '+(x2-h*Math.cos(a-k))+','+(y2-h*Math.sin(a-k))+' '+(x2-h*Math.cos(a+k))+','+(y2-h*Math.sin(a+k))+'" fill="'+c+'"/>'}
function lab(x,y,t,c){return '<text x="'+x+'" y="'+y+'" font-size="20" font-style="italic" font-weight="700" fill="'+c+'" text-anchor="middle" font-family="Georgia,serif">'+t+'</text>'+arr(x-7,y-21,x+7,y-21,c,1.6,5)}
function figSvg(f){var S=44,P=14,i,W,H,X,Y,c,r,o='';
  if(f.k==='base'){c=f.cols;r=f.rows;X=function(g){return g*S};Y=function(g){return r*S-g*S}}
  else{c=f.x1-f.x0;r=f.y1-f.y0;X=function(g){return (g-f.x0)*S};Y=function(g){return (f.y1-g)*S}}
  W=c*S;H=r*S;
  for(i=0;i<=c;i++)o+='<line x1="'+i*S+'" y1="0" x2="'+i*S+'" y2="'+H+'" stroke="#b9b7ae" stroke-width="1.2"/>';
  for(i=0;i<=r;i++)o+='<line x1="0" y1="'+i*S+'" x2="'+W+'" y2="'+i*S+'" stroke="#b9b7ae" stroke-width="1.2"/>';
  if(f.k==='base'){
    f.vecs.forEach(function(v){o+=arr(X(v.a[0]),Y(v.a[1]),X(v.b[0]),Y(v.b[1]),v.c,3.5,13)+lab((X(v.a[0])+X(v.b[0]))/2+16,(Y(v.a[1])+Y(v.b[1]))/2-6,v.n,v.c)});
    o+=arr(X(f.bx),Y(f.by),X(f.bx+1),Y(f.by),'#111',3.5,13)+arr(X(f.bx),Y(f.by),X(f.bx),Y(f.by+1),'#111',3.5,13)+lab(X(f.bx+.5),Y(f.by)+32,'i','#111')+lab(X(f.bx)-14,Y(f.by+.5)+6,'j','#111');
  }else{
    o+='<line x1="0" y1="'+Y(0)+'" x2="'+W+'" y2="'+Y(0)+'" stroke="#111" stroke-width="2.6"/><line x1="'+X(0)+'" y1="0" x2="'+X(0)+'" y2="'+H+'" stroke="#111" stroke-width="2.6"/>';
    o+=arr(X(0),Y(0),X(1),Y(0),'#d6283a',4,13)+arr(X(0),Y(0),X(0),Y(1),'#d6283a',4,13)+lab(X(.5),Y(0)+32,'i','#d6283a')+lab(X(0)-14,Y(.5)+6,'j','#d6283a');
    o+='<text x="'+(X(0)-18)+'" y="'+(Y(0)+20)+'" font-size="18" font-style="italic" fill="#d6283a" font-family="Georgia,serif">O</text>';
    f.pts.forEach(function(p){o+='<circle cx="'+X(p.p[0])+'" cy="'+Y(p.p[1])+'" r="6" fill="#111"/><text x="'+(X(p.p[0])+10)+'" y="'+(Y(p.p[1])-10)+'" font-size="20" font-weight="700" fill="#111" font-family="Arial,sans-serif">'+p.n+'</text>'});
  }
  return '<svg viewBox="'+(-P)+' '+(-P)+' '+(W+2*P)+' '+(H+2*P+24)+'" style="width:100%;max-height:310px;margin-top:6px">'+o+'</svg>'}
BANK.jaune.push(figCard(R`Déterminer les coordonnées des vecteurs $\vec{u}$, $\vec{v}$ et $\vec{w}$ dans la base $(\vec{i},\vec{j})$.`,{k:'base',cols:10,rows:5,bx:7,by:3,vecs:[{n:'u',a:[5,1],b:[3,3],c:'#1b9e4b'},{n:'v',a:[0,4],b:[3,2],c:'#e8761c'},{n:'w',a:[6,1],b:[9,2],c:'#d6283a'}]}));
BANK.violet.push(figCard(R`Lire les coordonnées des points $A$, $B$, $C$ et $D$, puis calculer celles de $\vc{AB}$ et $\vc{CD}$.`,{k:'pts',x0:-3,x1:5,y0:-3,y1:4,pts:[{n:'A',p:[-2,1]},{n:'B',p:[3,-2]},{n:'C',p:[4,3]},{n:'D',p:[1,-1]}],ask:[['A','B'],['C','D']]}));
var DURATION=180;
// ======================

var $=function(i){return document.getElementById(i)};
var remaining,drawn,rot,state,current,card,svg=$('rotor');

function plain(x){
  x=x.replace(/\\left|\\right/g,'').replace(/\\[,;!]|\\quad/g,' ').replace(/\\\|/g,'‖').replace(/\\times/g,'×').replace(/\\neq/g,'≠').replace(/\\iff/g,'⇔').replace(/\\det/g,'det');
  for(var k=0;k<3;k++){
    x=x.replace(/\\(?:vc|overrightarrow|vec)\{([^{}]*)\}/g,'<span class="vec">$1</span>')
     .replace(/\\(?:col|pt)\{([^{}]*)\}\{([^{}]*)\}/g,'($1 ; $2)')
     .replace(/\\frac\{([^{}]*)\}\{([^{}]*)\}/g,function(m,a,b){var w=function(z){return /[+\-]/.test(z.replace(/^-/,''))?'('+z+')':z};return w(a)+'/'+w(b)}).replace(/\\sqrt\{([^{}]*)\}/g,'√($1)')}
  return x.replace(/\^2/g,'²').replace(/_/g,'').replace(/[{}]/g,'')}
function mathText(t){
  t=t.split('¶').join('\n').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if(window.MathJax&&MathJax.typesetPromise)return t;
  return t.replace(/\$([^$]*)\$/g,function(m,x){return plain(x)})}
function typeset(){if(window.MathJax&&MathJax.typesetPromise){try{MathJax.typesetPromise([$('front')])}catch(e){}}}
function starHtml(){var h='<div class="starbadge">★ Carte spéciale · '+Math.round(card.time/60)+' min</div>';
  for(var i=0;i<16;i++)h+='<span class="spark" style="left:'+(Math.random()*92+2).toFixed(0)+'%;top:'+(Math.random()*92+2).toFixed(0)+'%;animation-delay:'+(Math.random()*2).toFixed(2)+'s;font-size:'+(14+Math.floor(Math.random()*16))+'px">✦</span>';
  return h}
function polar(a,r){var t=(a-90)*Math.PI/180;return [r*Math.cos(t),r*Math.sin(t)]}
function drawWheel(){
  svg.style.transition='none';svg.style.transform='rotate(0deg)';rot=0;
  var n=remaining.length,h='';
  for(var i=0;i<n;i++){
    var a0=i*360/n,a1=(i+1)*360/n,p0=polar(a0,96),p1=polar(a1,96),m=polar((a0+a1)/2,60);
    var d=n===1?'M0 -96A96 96 0 1 1 -0.01 -96Z':'M0 0L'+p0[0]+' '+p0[1]+'A96 96 0 '+((a1-a0)>180?1:0)+' 1 '+p1[0]+' '+p1[1]+'Z';
    h+='<path d="'+d+'" fill="'+remaining[i].hex+'" stroke="#fff" stroke-width="1.5"/>';
    h+='<text x="'+m[0]+'" y="'+m[1]+'" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="700" fill="#fff" stroke="rgba(0,0,0,.35)" stroke-width=".4" transform="rotate('+((a0+a1)/2)+' '+m[0]+' '+m[1]+')">'+remaining[i].name+'</text>';
  }
  $('wg').innerHTML=h;
}
function setState(s){
  state=s;var total=FAMILIES.length;
  var onCard=(s==='back'||s==='question'||s==='answer');
  $('wheelView').classList.toggle('hidden',onCard);
  $('cardView').classList.toggle('hidden',!onCard);
  var over=s==='wheel'&&drawn.length>=total;
  $('round').textContent=over?'Partie terminée !':'Manche '+(s==='wheel'||s==='spinning'?drawn.length+1:drawn.length)+' / '+total;
  $('chips').innerHTML=drawn.map(function(f){return '<span class="chip" title="'+f.name+'" style="background:'+f.hex+'"></span>'}).join('');
  $('spin').disabled=over||s==='spinning';
  $('start').disabled=(s!=='question');$('early').disabled=(s!=='question');
  $('help').textContent={wheel:'',spinning:'',back:'Touchez la carte pour la retourner.',question:'Lisez la question, puis lancez le chrono.',answer:'Touchez la carte réponse pour continuer.'}[s]||'';
}
function newGame(){dur=DURATION;remaining=FAMILIES.slice();drawn=[];drawWheel();resetTimer();setState('wheel')}

$('spin').onclick=function(){
  if(state!=='wheel'||!remaining.length)return;
  setState('spinning');
  var n=remaining.length,k=Math.floor(Math.random()*n),seg=360/n;
  var center=k*seg+seg/2+(Math.random()-.5)*seg*.6;
  var delta=((360-center)-(rot%360)+360)%360;
  rot=rot+360*5+delta;current=remaining[k];
  svg.style.transition='transform 4.5s cubic-bezier(.12,.6,.1,1)';
  svg.style.transform='rotate('+rot+'deg)';
  setTimeout(showBack,4700);
};
function showBack(){
  var list=BANK[current.id];if(drawn.length===0)list=list.filter(function(c){return !c.star});card=list[Math.floor(Math.random()*list.length)];
  remaining=remaining.filter(function(f){return f!==current});drawn.push(current);
  $('back').className='face back'+(card.star?' starcard':'');$('back').style.background=current.hex;
  $('back').innerHTML=(current.img?'<img src="'+current.img+'" alt="">':'<div class="emoji">'+current.emoji+'</div>')+'<div class="vn">'+current.villain+'</div><div class="hint">'+current.name+' · touchez pour retourner</div>'+(card.star?starHtml():'');
  $('inner').style.transition='none';$('inner').classList.remove('flip');
  void $('inner').offsetWidth;$('inner').style.transition='';
  $('front').className='face front';$('front').style.setProperty('--c',current.hex);
  $('front').innerHTML='<span class="tag">'+(card.star?'★ ':'')+current.label+'</span><div id="ft"></div>';
  $('ft').innerHTML=mathText(card.q)+(card.fig?figSvg(card.fig):'');typeset();
  dur=card.time||DURATION;resetTimer();setState('back');
}
$('scene').onclick=function(){
  if(state==='back'){$('inner').classList.add('flip');setState('question')}
  else if(state==='answer'){drawWheel();setState('wheel')}
};
function showAnswer(){
  $('front').className='face front ans';
  $('front').innerHTML='<span class="tag">Réponse</span><div id="ft"></div><small>Touchez la carte pour continuer</small>';
  $('ft').innerHTML=mathText(card.a);typeset();
  setState('answer');
}
$('newgame').onclick=function(){if(confirm('Recommencer une nouvelle partie ?'))newGame()};

// Chrono
var dur=DURATION,left=DURATION,tick=null,ac=null;
function fmt(s){return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2)}
function showTime(){$('time').textContent=fmt(left);$('time').classList.toggle('end',left===0)}
function resetTimer(){clearInterval(tick);tick=null;left=dur;showTime();$('start').textContent='Lancer le chrono'}
function beep(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  [0,.35,.7].forEach(function(t){var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);
  g.gain.setValueAtTime(.3,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+.3);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.3)})}catch(e){}}
$('start').onclick=function(){
  if(state!=='question')return;
  if(tick){clearInterval(tick);tick=null;$('start').textContent='Reprendre';return}
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
  $('start').textContent='Pause';
  tick=setInterval(function(){left--;showTime();if(left<=0){left=0;clearInterval(tick);tick=null;showTime();beep();showAnswer()}},1000);
};
$('reset').onclick=resetTimer;
$('early').onclick=function(){if(state!=='question')return;clearInterval(tick);tick=null;showAnswer()};
newGame();
</script>
