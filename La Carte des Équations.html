{r:1,t:"Calcule : [1|2] − [5|7]",o:["[−3|14]","[3|14]","[4|5]","[−2|7]"],c:0,h:"Mets au même dénominateur (ici 14), puis soustrais les numérateurs.",s:"[1|2] = [7|14] et [5|7] = [10|14]. Donc [7|14] − [10|14] = [−3|14]."},

{r:3,t:"Factorise : (x + 1)² − (2x + 3)²",o:["(−x − 2)(3x + 4)","(−x + 4)(3x + 4)","(−x − 2)(3x + 2)","(x − 2)(3x + 4)"],c:0,h:"a² − b² = (a − b)(a + b) avec a = x + 1 et b = 2x + 3. Mets des parenthèses pour a − b !",s:"a − b = (x + 1) − (2x + 3) = −x − 2 et a + b = (x + 1) + (2x + 3) = 3x + 4. Donc (−x − 2)(3x + 4)."},
{r:4,t:"Résous : 5x − 10x² = 0",o:["S = {[1|2]}","S = {0 ; 2}","S = {0 ; [1|2]}","S = {0 ; [−1|2]}"],c:2,h:"Factorise par 5x, puis utilise la règle du produit nul.",s:"5x − 10x² = 5x(1 − 2x) = 0. 5x = 0 donne x = 0 ; 1 − 2x = 0 donne x = [1|2]. S = {0 ; [1|2]}."},

],[

{r:1,t:"Réduis (x ≠ 1 et x ≠ 2) : [2x|x − 1] − [x + 3|x − 2]",o:["[x² − 6x − 3|(x − 1)(x − 2)]","x − 3","[x² − 2x + 3|(x − 1)(x − 2)]","[x² − 6x + 3|(x − 1)(x − 2)]"],c:3,h:"Dénominateur commun (x − 1)(x − 2). Le signe − s’applique à tout le numérateur de la 2ᵉ fraction.",s:"[2x(x − 2) − (x + 3)(x − 1)|(x − 1)(x − 2)] = [2x² − 4x − (x² + 2x − 3)|(x − 1)(x − 2)] = [x² − 6x + 3|(x − 1)(x − 2)]."},
{r:2,t:"Résous : [x − 7|6] = [x + 7|3]",o:["x = 21","x = −7","x = −21","x = 7"],c:2,h:"Multiplie les deux membres par le dénominateur commun (6) pour supprimer les dénominateurs, puis résous l’équation obtenue.",s:"On multiplie les deux membres par 6 : 6 × [x − 7|6] = 6 × [x + 7|3], soit x − 7 = 2(x + 7). On développe : x − 7 = 2x + 14, donc x − 2x = 14 + 7, d’où x = −21."},

function finish(){
 const v=Object.values(S.res),good=v.reduce((a,b)=>a+b,0),n=v.length,p=n?good/n:0,r=S.r;
 const msg=r===3?"":p>=.8&&r<2?`Très bonne maîtrise : tente la route ${ROUTES[r+1].n} !`:p<.5&&r>0?`Reprends les méthodes sur la route ${ROUTES[r-1].n}, c’est une bonne idée.`:"Relis les solutions des questions où tu as hésité.";
 S.modal={t:r===3?"Mission accomplie !":"Monde terminé !",s:`${good} question${good>1?"s":""} sur ${n} réussie${good>1?"s":""} du premier coup. ${msg}`};
 S.unlocked=true;try{localStorage.setItem("ceq","1")}catch(e){}
 S.r=null;S.st="q";}
function pickU(prev){const pool=Q.slice(0,3).flatMap(L=>L.filter(x=>x.r===S.row)).filter(x=>x!==prev);S.q=pool[Math.floor(Math.random()*pool.length)];S.t=0;S.bad=[];S.st="q";}
function renderU(){
 if(S.w==="m"){
  $.innerHTML=`<div style="--rc:var(--terre)"><div class="top"><span class="rt">⛏️ Monde sous la terre</span><button class="back" data-quit>← Retour à la carte</button></div><p class="mute">Choisis la méthode à travailler : un exercice type s’affiche, avec la méthode à portée de main.</p><div class="routes">${ORDER.map(r=>`<button class="rcard" style="--rc:var(--terre)" data-um="${r}"><span class="em">⛏️</span><span><b>${ROWS[r]}</b></span></button>`).join("")}</div></div>`;return;}
 const q=S.q;
 const opts=q.o.map((o,k)=>{const bad=S.bad.includes(k),ok=S.st!=="q"&&k===q.c;return `<button class="opt ${bad?"bad":""} ${ok?"ok":""}" data-opt="${k}" ${bad||S.st!=="q"?"disabled":""}>${fmt(o)}</button>`}).join("");
 let fb="";
 if(S.st==="q"&&S.t===1)fb=`<div class="fb hint">Pas tout à fait. Ouvre la méthode à droite, reprends ton cahier et retente.</div>`;
 if(S.st==="ok")fb=`<div class="fb good"><b>Bien joué ✓</b></div>`;
 if(S.st==="rev")fb=`<div class="fb sol"><b>Voici la solution détaillée :</b><br>${fmt(q.s)}</div>`;
 const acts=S.st!=="q"?`<div class="acts"><button class="nx" data-other>Un autre exercice</button><button class="nx alt" data-quit>Quitter</button></div>`:"";
 $.innerHTML=`<div style="--rc:var(--terre)"><div class="top"><span class="rt">⛏️ ${ROWS[S.row]}</span><button class="back" data-menu>← Autres méthodes</button></div><div class="u"><section class="card"><p class="row">Exercice type</p><h2 class="q">${fmt(q.t)}</h2><div class="opts">${opts}</div>${fb}${acts}</section><aside class="card"><button class="nx" style="margin:0" data-meth>${S.mshow?"Masquer la méthode":"Redonne-moi la méthode"}</button>${S.mshow?`<div class="fb hint">${fmt(METH[S.row])}</div>`:""}</aside></div></div>`;}
const fmt=s=>s.replace(/\[([^\[\]|]+)\|([^\[\]|]+)\]/g,'<span class="fr"><span>$1</span><span>$2</span></span>');
function go(r,i){S.r=r;S.i=i;S.t=0;S.bad=[];S.st="q";}
function render(){
 if(S.w)return renderU();
 if(S.r===null){
  $.innerHTML='<h1>La Carte des Équations</h1><p class="mute">Choisis ta route. Tu pourras en changer à tout moment, sans pénalité.</p><div class="routes">'+
  ROUTES.slice(0,3).map((R,k)=>`<button class="rcard" style="--rc:${R.c}" data-route="${k}"><span class="em">${R.e}</span><span><b>Route ${R.n}</b><br>${R.d}</span></button>`).join("")+(S.unlocked&&!S.modal?EXTRA:"")+'</div>'+modalHTML();
  return;}
 const R=ROUTES[S.r],L=Q[S.r];
 if(S.st==="end"){
  const v=Object.values(S.res),good=v.reduce((a,b)=>a+b,0),n=v.length,p=n?good/n:0;
  let msg=p>=.8&&S.r<2?`Très bonne maîtrise : tente la route ${ROUTES[S.r+1].n} !`:p<.5&&S.r>0?`Reprends les méthodes sur la route ${ROUTES[S.r-1].n}, c’est une bonne idée.`:"Bien joué, relis les solutions des questions où tu as hésité.";
  $.innerHTML=`<div class="card end" style="--rc:${R.c}"><div class="big">🏰</div><h1>Château atteint !</h1><p>${good} question${good>1?"s":""} sur ${n} réussie${good>1?"s":""} du premier coup.</p><p>${msg}</p><button class="nx" data-restart>Choisir une autre route</button></div>`;
  return;}
 const q=L[S.i],last=S.i===L.length-1;
 const sw=S.r===3?"":ROUTES.slice(0,3).map((x,k)=>k===S.r?"":`<button style="--c:${x.c}" data-switch="${k}">${x.e} ${x.n}</button>`).join("");
 const map=L.map((x,j)=>`<li class="${S.res[x.t]!==undefined?"done":""} ${j===S.i?"cur":""}">${S.res[x.t]!==undefined?"✓":j+1}</li>`).join('<span class="bar"></span>')+'<span class="bar"></span><li class="cs">🏰</li>';
 const opts=q.o.map((o,k)=>{const bad=S.bad.includes(k),ok=S.st!=="q"&&k===q.c;
  return `<button class="opt ${bad?"bad":""} ${ok?"ok":""}" data-opt="${k}" ${bad||S.st!=="q"?"disabled":""}>${fmt(o)}</button>`}).join("");
 let fb="";
 if(S.st==="q"&&S.t===1)fb=`<div class="fb hint"><b>Un indice : la méthode.</b><br>${fmt(q.h)}<br><span class="mute">Reprends l’exercice sur ton cahier avec cette méthode, puis retente (dernier essai).</span></div>`;
 if(S.st==="ok")fb=`<div class="fb good"><b>Bien joué ✓</b>${S.t===0?" Du premier coup !":""}</div><button class="nx" data-next>${last?"Voir mon résultat":"Question suivante"}</button>`;
 if(S.st==="rev")fb=`<div class="fb sol"><b>Pas de panique, voici la solution détaillée :</b><br>${fmt(q.s)}</div><button class="nx" data-next>${last?"Voir mon résultat":"Question suivante"}</button>`;
 $.innerHTML=`<div style="--rc:${R.c}"><div class="top"><span class="rt">${R.e} Route ${R.n}</span><span class="sw">${sw?"Passerelle : "+sw:""}</span></div><ol class="map">${map}</ol>
 ${S.r===3?`<div class="card" style="margin-bottom:12px"><p class="row">Énoncé</p>${fmt(ENONCE[q.r])}</div>`:""}<section class="card"><p class="row">${ROWS[q.r]} · essai ${Math.min(S.t+1,2)}/2</p><h2 class="q">${fmt(q.t)}</h2><div class="opts">${opts}</div>${fb}</section>
 <div class="tr"><button data-restart>Recommencer depuis le début</button></div></div>`;
}
$.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.route!==undefined){S.res={};go(+b.dataset.route,0);}
 else if(b.dataset.world==="c"){S.res={};go(3,0);}
 else if(b.dataset.world==="u"||b.dataset.menu!==undefined){S.w="m";}
 else if(b.dataset.close!==undefined){S.modal=null;}
 else if(b.dataset.um!==undefined){S.w="p";S.row=+b.dataset.um;S.mshow=false;pickU(null);}
 else if(b.dataset.other!==undefined){pickU(S.q);}
 else if(b.dataset.quit!==undefined){S.w=null;}
 else if(b.dataset.meth!==undefined){S.mshow=!S.mshow;}
 else if(b.dataset.restart!==undefined){S.r=null;S.w=null;}
 else if(b.dataset.switch!==undefined){const row=Q[S.r][S.i].r,nr=+b.dataset.switch;go(nr,Q[nr].findIndex(x=>x.r===row));}
 else if(b.dataset.next!==undefined){if(S.i+1>=Q[S.r].length)finish();else go(S.r,S.i+1);}
 else if(b.dataset.opt!==undefined&&S.st==="q"){
  const q=S.w==="p"?S.q:Q[S.r][S.i],k=+b.dataset.opt;
  if(k===q.c){S.res[q.t]=S.t===0?1:0;S.st="ok";}
  else{S.bad.push(k);S.t++;if(S.t>=2){S.res[q.t]=0;S.st="rev";}}
 }
 render();window.scrollTo({top:0});
});
render();
</script></body></html>
